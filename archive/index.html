<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COLDPATH — Account Intelligence Engine</title>
<style>
:root{
  --bg:#080B11; --bg2:#0C1119; --panel:#111925; --panel2:#151E2C; --panel3:#1A2433;
  --line:#1E2A3A; --line2:#2A3A4E;
  --txt:#E6EDF5; --txt2:#9AACBF; --txt3:#647689;
  --cyan:#3FD8E8; --cyan-d:#1BA8B8; --cyan-g:rgba(63,216,232,.12);
  --amber:#F5A623; --amber-g:rgba(245,166,35,.12);
  --red:#F2697A; --red-g:rgba(242,105,122,.12);
  --green:#3DDC97; --green-g:rgba(61,220,151,.12);
  --violet:#9B8CFF; --violet-g:rgba(155,140,255,.12);
  --doc-bg:#0F1620; --doc-txt:#D3DDE8; --doc-strong:#FFFFFF;
  --soft-cyan:#C8E9EE; --soft-amber:#F0C67A; --soft-red:#E8B9C0; --soft-amber2:#D9B271;
  --av-a:#2C7F8C; --av-b:#1B4E63;
  --btnp-a:#4FE0EE; --btnp-b:#26B9C9; --btnp-txt:#04262B;
  --ov-bg:rgba(4,7,12,.78); --tour-ov:rgba(4,7,12,.84); --tour-a:#16202D; --tour-b:#111925;
  --login-bg:radial-gradient(1100px 620px at 50% -8%,#123039 0%,#0A1017 55%,#080B11 100%);
  --login-mark-bg:#0E2A31;
  --sb:#243040; --sb-h:#33445A; --btn-line-h:#3A4C64; --on-green:#04241A; --dot-done:#2E6B77;
  --shadow:0 24px 70px rgba(0,0,0,.65); --shadow-sm:0 10px 30px rgba(0,0,0,.5);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:8px;
}
html[data-theme="light"]{
  --bg:#EEF2F5; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F6F8FA; --panel3:#E9EEF3;
  --line:#DCE3EA; --line2:#C4D0DB;
  --txt:#15212B; --txt2:#4C5E6E; --txt3:#7C8C9B;
  --cyan:#0B6E7E; --cyan-d:#0A5A67; --cyan-g:rgba(11,110,126,.10);
  --amber:#8C5A10; --amber-g:rgba(140,90,16,.10);
  --red:#A03244; --red-g:rgba(160,50,68,.09);
  --green:#186A49; --green-g:rgba(24,106,73,.10);
  --violet:#54469A; --violet-g:rgba(84,70,154,.10);
  --doc-bg:#FBFCFD; --doc-txt:#2C3B48; --doc-strong:#0E1A22;
  --soft-cyan:#0B5F6D; --soft-amber:#7A4E0E; --soft-red:#8E2C3C; --soft-amber2:#7A4E0E;
  --av-a:#3E93A3; --av-b:#2A6C7C;
  --btnp-a:#12909F; --btnp-b:#0C7382; --btnp-txt:#FFFFFF;
  --ov-bg:rgba(20,32,42,.42); --tour-ov:rgba(226,233,238,.86); --tour-a:#FFFFFF; --tour-b:#F7F9FB;
  --login-bg:radial-gradient(1100px 620px at 50% -8%,#DCEDEF 0%,#EEF2F5 55%,#E7ECF1 100%);
  --login-mark-bg:#E4F2F4;
  --sb:#C4D0DB; --sb-h:#A9B8C6; --btn-line-h:#9FB1C0; --on-green:#FFFFFF; --dot-done:#9CC4CB;
  --shadow:0 20px 54px rgba(24,40,54,.20); --shadow-sm:0 8px 22px rgba(24,40,54,.14);
}
html[data-theme="light"] .brand-txt span,
html[data-theme="light"] .lg-brand span{color:var(--cyan)}
html[data-theme="light"] body{-webkit-font-smoothing:auto}
html[data-theme="light"] .stat:before{opacity:.9}
html[data-theme="light"] #t-spot{box-shadow:0 0 0 9999px var(--tour-ov),0 0 0 2px rgba(11,110,126,.22) inset}
html[data-theme="light"] #t-card{box-shadow:0 18px 46px rgba(24,40,54,.24)}
html[data-theme="light"] .mx-c:hover{transform:translateY(-1px)}
html[data-theme="light"] .doc-b .email,
html[data-theme="light"] .doc-b .kpi div,
html[data-theme="light"] .doc-b .q{background:var(--panel2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13.5px;line-height:1.68;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Icons had no global size rule, so any svg rendered outside .nav-i/.btn/.sig-ic
   fell back to the SVG default (~150px) and blew out card headers. One rule fixes
   all of them; specific contexts override below. .arch is a class selector and
   therefore still wins for the architecture diagram. */
svg{width:13px;height:13px;flex:0 0 auto;vertical-align:-2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--sb-h)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--cyan);text-decoration:none}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px 1fr;height:100vh}
#side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 20px 18px;border-bottom:1px solid var(--line)}
.brand-name{display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;flex:0 0 22px}
.brand-txt{font-weight:800;letter-spacing:.16em;font-size:14px}
.brand-txt span{color:var(--cyan)}
.brand-sub{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-top:6px;padding-left:31px}
nav{flex:1;overflow-y:auto;padding:14px 11px}
.nav-grp{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--txt3);text-transform:uppercase;padding:15px 9px 7px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:6px;color:var(--txt2);font-size:13px;width:100%;text-align:left;transition:.13s;position:relative}
.nav-i:hover{background:var(--panel);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(63,216,232,.14),rgba(63,216,232,.03));color:#fff;font-weight:600}
.nav-i.on:before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:2px;background:var(--cyan);border-radius:2px}
.nav-i svg{width:13.5px;height:13.5px;flex:0 0 13.5px;opacity:.8}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:20px;background:var(--panel3);color:var(--txt2)}
.nav-i.on .nav-badge{background:rgba(63,216,232,.2);color:var(--cyan)}
.side-foot{border-top:1px solid var(--line);padding:14px}
.who{display:flex;align-items:center;gap:9px}
.av{width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,var(--av-a),var(--av-b));display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex:0 0 25px}
.who-n{font-size:12px;font-weight:600}
.who-r{font-family:var(--mono);font-size:9.5px;color:var(--txt3);letter-spacing:.05em}

#main{display:flex;flex-direction:column;overflow:hidden}
#top{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;background:var(--bg2)}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--txt3);text-transform:uppercase}
.crumb b{color:var(--txt);font-weight:600}
.top-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.07em;padding:4px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--txt2);text-transform:uppercase}
.pill.live{border-color:rgba(61,220,151,.35);color:var(--green);background:var(--green-g)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pu 1.8s infinite}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
#view{flex:1;overflow-y:auto;padding:30px 36px 84px}

/* ---------- primitives ---------- */
.h1{font-size:22.5px;font-weight:750;letter-spacing:-.02em;line-height:1.26}
.h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:12.5px;font-weight:700}
.sub{color:var(--txt2);font-size:13px;line-height:1.72;max-width:72ch}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3)}
.pg{display:flex;align-items:flex-end;gap:18px;margin-bottom:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card-h svg{opacity:.62}
.card-b{padding:19px 21px}
.grid{display:grid;gap:18px}
.row{display:flex;gap:18px}
.mt{margin-top:19px}.mt2{margin-top:30px}.mb{margin-bottom:19px}
.hr{height:1px;background:var(--line);margin:19px 0}
.muted{color:var(--txt2)}
.dim{color:var(--txt3)}
.mono{font-family:var(--mono)}
.sm{font-size:11.5px}
.xs{font-size:10.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.flex{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sp{flex:1}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:2.5px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.t-cyan{background:var(--cyan-g);color:var(--cyan);border-color:rgba(63,216,232,.25)}
.t-amber{background:var(--amber-g);color:var(--amber);border-color:rgba(245,166,35,.25)}
.t-red{background:var(--red-g);color:var(--red);border-color:rgba(242,105,122,.25)}
.t-green{background:var(--green-g);color:var(--green);border-color:rgba(61,220,151,.25)}
.t-violet{background:var(--violet-g);color:var(--violet);border-color:rgba(155,140,255,.25)}
.t-gray{background:var(--panel3);color:var(--txt2);border-color:var(--line2)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);transition:.13s}
.btn:hover{background:var(--panel3);border-color:var(--btn-line-h)}
.btn svg{width:11.5px;height:11.5px}
.btn-p{background:linear-gradient(180deg,var(--btnp-a),var(--btnp-b));color:var(--btnp-txt);border-color:transparent}
.btn-p:hover{background:linear-gradient(180deg,var(--btnp-a),var(--btnp-b));filter:brightness(1.1)}
.btn-s{padding:4px 9px;font-size:11.5px}
.btn-g{background:transparent}

/* stat */
.stat{padding:17px 19px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--ac,var(--cyan));opacity:.75}
.stat-v{font-size:25px;font-weight:750;letter-spacing:-.025em;line-height:1.12;margin:9px 0 3px;font-variant-numeric:tabular-nums}
.stat-d{font-size:11px;color:var(--txt3);line-height:1.5;margin-top:2px}

/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12.5px;line-height:1.6}
tr:last-child td{border-bottom:none}
tbody tr{transition:.1s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--panel2)}
tbody tr.sel{background:rgba(63,216,232,.07)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--cyan)}
.tscroll{max-height:520px;overflow:auto}

/* score */
.score{display:inline-flex;align-items:center;justify-content:center;width:34px;height:22px;border-radius:4px;font-family:var(--mono);font-size:11.5px;font-weight:700}
.s-hi{background:var(--green-g);color:var(--green);border:1px solid rgba(61,220,151,.3)}
.s-md{background:var(--amber-g);color:var(--amber);border:1px solid rgba(245,166,35,.3)}
.s-lo{background:var(--panel3);color:var(--txt3);border:1px solid var(--line2)}

/* signal */
.sig{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:none}
.sig-ic{width:22px;height:22px;border-radius:5px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.sig-ic svg{width:11.5px;height:11.5px}
.sig-t{font-size:12.5px;font-weight:600;line-height:1.35}
.sig-d{font-size:11.5px;color:var(--txt2);margin-top:4px;line-height:1.62}
.sig-m{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* pain */
.pain{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);overflow:hidden}
.pain-h{padding:13px 17px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);background:var(--panel)}
.pain-b{padding:15px 17px}
.sev{display:flex;gap:2.5px;align-items:center}
.sev i{width:5px;height:12px;border-radius:1.5px;background:var(--line2);display:block}
.sev i.f{background:var(--red)}
.sev i.f.md{background:var(--amber)}
.sev i.f.lo{background:var(--cyan-d)}

/* meter */
.meter{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan-d),var(--cyan))}

/* person */
.person{display:flex;gap:13px;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.person .av{width:29px;height:29px;flex:0 0 29px;font-size:10.5px}
.gapflag{border-style:dashed;border-color:rgba(245,166,35,.4);background:var(--amber-g)}

/* deliverable doc */
.doc{background:var(--doc-bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.doc-h{padding:18px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.doc-b{padding:30px 36px;font-size:13.5px;line-height:1.78;max-height:none}
.doc-b h4{font-size:11px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);margin:30px 0 12px;font-weight:600}
.doc-b h4:first-child{margin-top:0}
.doc-b p{margin-bottom:14px;color:var(--doc-txt)}
.doc-b ul,.doc-b ol{margin:0 0 15px 20px;color:var(--doc-txt)}
.doc-b li{margin-bottom:9px}
.doc-b strong{color:var(--doc-strong);font-weight:650}
.doc-b em{color:var(--amber);font-style:normal}
.doc-b .q{border-left:2px solid var(--cyan);padding:12px 0 12px 17px;margin:17px 0;color:var(--txt);background:rgba(63,216,232,.04);font-size:13px;line-height:1.72}
.doc-b table{margin:10px 0 14px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.doc-b th{position:static;background:var(--panel2);font-size:9px}
.doc-b td{font-size:12px;padding:7px 10px}
.doc-b .email{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:12px 0 19px;font-size:12.8px;line-height:1.72}
.doc-b .email .meta{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc-b .email .subj{font-weight:650;color:#fff;margin-bottom:7px}
.doc-b .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin:17px 0}
.doc-b .kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.doc-b .kpi b{display:block;font-size:18px;font-weight:750;letter-spacing:-.02em;color:var(--cyan)}
.doc-b .kpi span{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.doc-b .warn{background:var(--amber-g);border:1px solid rgba(245,166,35,.3);border-radius:6px;padding:13px 16px;margin:16px 0;font-size:12.5px;color:var(--soft-amber);line-height:1.7}

/* source list */
.src{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.src:last-child{border-bottom:none}
.src-n{font-family:var(--mono);font-size:9.5px;color:var(--txt3);width:16px;flex:0 0 16px;padding-top:2px}

/* conf */
.conf{display:inline-flex;gap:3px;align-items:center}
.conf i{width:4px;height:9px;border-radius:1px;background:var(--line2);display:block}
.conf i.f{background:var(--green)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{padding:10px 15px;font-size:12.5px;color:var(--txt3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:600;transition:.13s}
.tab:hover{color:var(--txt2)}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}

/* segmented */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:5px;font-size:11.5px;color:var(--txt3);font-weight:600}
.seg button.on{background:var(--panel3);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4)}

/* stage pipeline */
.stage{display:flex;align-items:center;gap:10px;padding:11px 0}
.stage-n{width:17px;height:17px;border-radius:50%;flex:0 0 17px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-weight:700;border:1px solid var(--line2);color:var(--txt3)}
.stage.done .stage-n{background:var(--green);border-color:var(--green);color:var(--on-green)}
.stage.run .stage-n{background:var(--cyan-g);border-color:var(--cyan);color:var(--cyan);animation:pu 1.4s infinite}
.stage-t{font-size:12.5px;font-weight:600}
.stage.run .stage-t{color:var(--cyan)}
.stage.todo .stage-t{color:var(--txt3)}
.stage-d{font-size:11px;color:var(--txt3);margin-left:auto;font-family:var(--mono)}

/* funnel */
.fn{display:flex;gap:5px;align-items:flex-end;height:96px}
.fn-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.fn-b{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--cyan),rgba(63,216,232,.18));min-height:4px}
.fn-l{font-family:var(--mono);font-size:9px;color:var(--txt3);text-align:center;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.fn-v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:3px}
.mx th{position:static;background:transparent;border:none;padding:5px 7px;font-size:8.5px}
.mx td{border:none;padding:0}
.mx-c{width:100%;height:56px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.13s;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--txt3)}
.mx-c:hover{border-color:var(--cyan);background:var(--cyan-g);color:var(--cyan);transform:translateY(-1px)}
.mx-c.pub{background:var(--green-g);border-color:rgba(61,220,151,.3);color:var(--green)}
.mx-c.rev{background:var(--amber-g);border-color:rgba(245,166,35,.3);color:var(--amber)}
.mx-c.none{opacity:.32;cursor:default}
.mx-c.none:hover{transform:none;border-color:var(--line);background:var(--panel2);color:var(--txt3)}

/* icp */
.icp-r{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.icp-r:last-child{border-bottom:none}
.w{font-family:var(--mono);font-size:10px;color:var(--cyan);width:34px;text-align:right}

/* arch svg */
.arch{width:100%;height:auto;display:block}

/* modal */
#ov{position:fixed;inset:0;background:var(--ov-bg);backdrop-filter:blur(3px);display:none;z-index:100;align-items:center;justify-content:center;padding:34px}
#ov.on{display:flex}
#mdl{background:var(--panel);border:1px solid var(--line2);border-radius:11px;max-width:880px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
#mdl-h{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
#mdl-b{padding:0;overflow-y:auto}
#x{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--txt3)}
#x:hover{background:var(--panel3);color:var(--txt)}

.kbd{font-family:var(--mono);font-size:9.5px;padding:1.5px 5px;border-radius:3px;background:var(--panel3);border:1px solid var(--line2);color:var(--txt2)}
.fade{animation:fi .28s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:10px 17px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:var(--shadow-sm)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chk{width:14px;height:14px;border-radius:3px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 14px}
.chk.on{background:var(--cyan);border-color:var(--cyan)}
.chk.on:after{content:"";width:6px;height:3.5px;border-left:1.8px solid var(--btnp-txt);border-bottom:1.8px solid var(--btnp-txt);transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:500;background:var(--login-bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login.off{display:none}
.lg-card{width:376px;max-width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:13px;
  padding:32px 30px 24px;text-align:center;box-shadow:var(--shadow)}
.lg-mark{width:42px;height:42px;margin-bottom:13px}
.lg-brand{font-size:19px;font-weight:800;letter-spacing:.16em}
.lg-brand span{color:var(--cyan)}
.lg-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-top:6px}
.lg-h{font-size:14px;font-weight:700;margin:24px 0 5px}
.lg-p{font-size:12px;color:var(--txt2);line-height:1.66;margin-bottom:16px}
.lg-pin{display:flex;gap:9px;justify-content:center;margin:4px 0 14px}
.lg-pin input{width:46px;height:56px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:700;
  background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);outline:none;transition:.15s}
.lg-pin input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-g)}
.lg-err{font-size:11.5px;color:var(--red);min-height:17px;margin-bottom:9px}
.lg-reps{display:grid;gap:6px;margin:2px 0 14px}
.lg-rep{padding:10px 13px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);
  display:flex;align-items:center;gap:10px;text-align:left;transition:.13s;cursor:pointer}
.lg-rep:hover{border-color:var(--cyan);background:var(--cyan-g)}
.lg-note{font-size:10.5px;line-height:1.62;color:var(--txt3);border-top:1px solid var(--line);padding-top:13px;margin-top:5px;text-align:left}
.lg-note b{color:var(--txt2)}
.lg-link{font-size:11.5px;color:var(--txt3);margin-top:11px;padding:4px 8px;border-radius:4px}
.lg-link:hover{color:var(--txt2);background:var(--panel3)}
/* ---------- theme toggle ---------- */
#btn-theme{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
/* ---------- guided walkthrough ---------- */
#t-spot{position:fixed;z-index:400;border-radius:9px;border:1.5px solid var(--cyan);
  box-shadow:0 0 0 9999px var(--tour-ov),0 0 26px rgba(63,216,232,.32) inset;
  pointer-events:none;opacity:0;transition:left .34s cubic-bezier(.4,0,.2,1),top .34s cubic-bezier(.4,0,.2,1),
  width .34s cubic-bezier(.4,0,.2,1),height .34s cubic-bezier(.4,0,.2,1),opacity .24s}
#t-spot.on{opacity:1}
#t-card{position:fixed;z-index:401;width:356px;background:linear-gradient(180deg,var(--tour-a),var(--tour-b));
  border:1px solid var(--line2);border-radius:11px;padding:19px 21px 15px;
  box-shadow:var(--shadow);
  opacity:0;transform:translateY(7px);pointer-events:none;
  transition:opacity .26s,transform .26s,left .34s cubic-bezier(.4,0,.2,1),top .34s cubic-bezier(.4,0,.2,1)}
#t-card.on{opacity:1;transform:none;pointer-events:auto}
#t-step{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
#t-title{font-size:15.5px;font-weight:750;letter-spacing:-.015em;margin:8px 0 9px;line-height:1.32}
#t-body{font-size:12.5px;line-height:1.74;color:var(--txt2)}
#t-body b{color:var(--txt);font-weight:650}
#t-body em{color:var(--amber);font-style:normal}
#t-body code{font-family:var(--mono);font-size:11px;color:var(--cyan);background:var(--bg2);padding:1px 4px;border-radius:3px}
#t-foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
#t-dots{display:flex;gap:4px;flex:1;flex-wrap:wrap;align-items:center}
#t-dots i{width:5px;height:5px;border-radius:50%;background:var(--line2);display:block;transition:.2s}
#t-dots i.on{background:var(--cyan);transform:scale(1.4)}
#t-dots i.done{background:var(--dot-done)}
#t-skip{font-size:11px;color:var(--txt3);padding:4px 7px;border-radius:4px}
#t-skip:hover{color:var(--txt2);background:var(--panel3)}
#btn-tour{animation:tp 2.8s ease-in-out infinite}
@keyframes tp{0%,100%{box-shadow:0 0 0 0 rgba(63,216,232,.32)}55%{box-shadow:0 0 0 6px rgba(63,216,232,0)}}
</style>
</head>

 snapshot:[
  `Kroger is the second-largest US supermarket operator by revenue and runs one of the largest distributed commercial refrigeration estates on the planet — roughly 2,700 stores plus ~50 distribution centres, ~38 manufacturing plants and a growing fleet of Ocado-partnered automated Customer Fulfilment Centres.`,
  `The commercially decisive fact is the margin. FY2025 revenue of <strong>$147.6B</strong> produced net income of roughly <strong>$1.0B — a 0.7% net margin</strong>. At that margin, <em>every dollar of avoided energy spend is worth approximately $143 of incremental sales</em>. Energy is the second-largest controllable store operating cost after labour, and refrigeration typically accounts for 40–50% of a supermarket's electricity consumption.`,
  `Kroger sits disproportionately in <strong>PJM</strong> and AEP-Ohio territory, where capacity auction clearing prices have moved from <strong>$28.92/MW-day (2024/25) to $329.17/MW-day (2026/27) — an 11.4x increase</strong> driven almost entirely by data-centre load growth. Grocery stores have flat, refrigeration-dominated load profiles that are expensive to shed, so they absorb capacity cost increases without the operational flexibility that caused them.`,
  `A federal enforcement event has now converted refrigeration from a facilities line-item into a board-level compliance programme.`
 ],

  {type:'technology',ic:'snow',cls:'t-cyan',date:'2025-01',title:'R744 transcritical CO2 now standard in all new stores',
   detail:'Kroger committed to installing CO2 (R744) transcritical units in all new stores starting 2025. The company states the ultra-low-GWP transition can reduce per-store emissions by more than 200 metric tons.',
   impact:'High',why:'Transcritical CO2 performance is highly ambient-dependent and sensitive to gas-cooler pressure optimisation and parallel-compression staging. These systems reward continuous optimisation far more than the HFC racks they replace — they are not a "fit and forget" asset.',
   src:['naturalrefrigerants.com / ATMO America','thepacker.com — Kroger climate-warming refrigerants']},
  {type:'capex',ic:'trend',cls:'t-cyan',date:'2026-03-05',title:'FY2026 capex reduced 4.0% to $3.855B',
   detail:'Full-year 2025 results reported 5 March 2026: revenue $147.6B, EPS $1.54, with capital expenditure of $3.855B — down 4.0% year on year.',
   impact:'Medium',why:'With capex contracting and margin at 0.7%, only fast-payback projects clear the hurdle. Any proposal must carry a sub-24-month payback model or it will not be funded.',

  {type:'leadership',ic:'users',cls:'t-gray',date:'2026-09-01',title:'New EVP & Chief eCommerce Officer — Nate Faust',

   impact:'Medium',why:'Automated CFCs plus an electrifying last-mile fleet is a concentrated, fast-growing load. Charging optimisation against the same coincident peak that drives capacity charges is an unsolved problem.',

  {type:'sustainability',ic:'globe',cls:'t-green',date:'2025-10',title:'2025 Responsible Business Report — aging refrigeration replacement programme',
   detail:'Kroger\'s 2025 Responsible Business Report cites replacing aging refrigeration systems to improve energy efficiency and reduce refrigerant charge and emissions, plus tighter refrigerant inventory management.',

 pains:[
  {p:0,sev:5,title:'600 mandated retrofits with no verification infrastructure',
   ev:'The DOJ settlement requires Kroger to retrofit or replace 600 units in 24 months, then validate each appliance meets the post-2019 20% leakage-rate threshold and report it to EPA. Execution will be spread across ~25 banners with inconsistent local practices and third-party service vendors producing non-standard paperwork.',
   angle:'Nsight provides continuous, auditable telemetry per system. Retrofit completion becomes a verified event with before/after performance data attached — not a service invoice in a folder. This is the difference between a defensible EPA submission and a reconstruction exercise in month 23.'},
  {p:0,sev:4,title:'Transcritical CO2 fleets drift — and nobody is watching',
   ev:'Kroger has committed to R744 transcritical in all new stores from 2025. Transcritical systems cross the CO2 critical point (~31°C / 88°F) in summer operation, where gas-cooler pressure optimisation and parallel-compression staging dominate efficiency. Commissioning settings that are optimal in Ohio in March are wrong in Georgia in July.',
   angle:'This is precisely the "measured by your unique output" position. Continuous ambient-aware optimisation of an already-installed CO2 fleet is a software play with near-zero incremental capex — attractive under a contracting $3.855B capex plan.'},
  {p:0,sev:5,title:'Store demand charges are now a PJM capacity tax',
   ev:'Capacity clearing prices in PJM rose 11.4x to $329.17/MW-day for 2026/27. Supermarket load is flat and refrigeration-dominated; the 15-minute coincident peak that sets the annual capacity tag is largely set by summer refrigeration and HVAC compression.',
   angle:'Peak-shaving the few hours per year that set the tag can move a store\'s capacity allocation for a full twelve months. Grid volatility response turns a pure cost increase into a managed, forecastable line.'},
  {p:1,sev:4,title:'Retrofit activity creates product-integrity and shrink exposure',
   ev:'Opening 600 refrigeration systems inside operating stores means planned and unplanned temperature excursions across medium-temp and low-temp product. Shrink during a retrofit wave is a direct, measurable P&L hit and a food-safety risk.',
   angle:'Precision cold product storage monitoring gives per-case and per-walk-in condition assurance during the work, with alerting that distinguishes a transient defrost from a genuine excursion.'},
  {p:1,sev:4,title:'Leak-rate reporting is a data problem, not a detection problem',
   ev:'The allowable commercial leakage threshold moved from 35% to 20% in 2019. Kroger is deploying infrared detectors capable of identifying lower refrigerant concentrations — but episodic detection does not produce the continuous charge-and-performance record EPA reporting assumes.',
   angle:'Pair detection events with continuous system performance telemetry so a leak is diagnosed, located and evidenced, not just discovered.'},
  {p:2,sev:4,title:'2,700 stores is an unmonetised flexibility asset',
   ev:'Kroger has aggregate thermal mass and deferrable load that would make it a top-tier demand-response participant, but no unified orchestration layer across banners, RTOs and IOU territories. Tariff structures differ materially across PJM, Duke, Dominion, TVA and SPP.',
   angle:'Grid volatility response plus demand-response enrolment converts refrigeration thermal mass into a revenue or bill-offset stream — a genuinely new line rather than a cost reduction.'},
  {p:3,sev:3,title:'CFC electrification is a load problem, not a charging problem',
   ev:'The eCommerce push under the new Chief eCommerce Officer expands automated Customer Fulfilment Centres and delivery fleets. Concentrated EV charging at a CFC lands directly on the same coincident peak that sets the site\'s capacity tag.',
   angle:'Shore-power and charging orchestration integrated with refrigeration load at the same site. Flagged as the weakest-fit pillar for Kroger — lead with pillars 1–3.',lowfit:true},
 ],

 comp:{
  incumbent:'Store BAS/EMS from Johnson Controls and Honeywell at banner level, plus refrigeration service vendors (HillPhoenix, AHT, Kysor Warren) and episodic utility-bill analysis. No unified production-aware layer across the estate.',
  alternates:['Enel X / CPower — demand response only, no refrigeration domain depth','Schneider EcoStruxure, Siemens Building X — building-centric, not cold-chain-centric','Retroficiency (Autodesk) — modelling and M&V, not live optimisation','Status quo — manual bill analysis + vendor spreadsheets'],
  wedge:'Ndustrial processes 250M data points per day, has 99.99% uptime over ten years, and has unlocked $100M+ in energy savings since 2011. Critically, 35% of US temperature-controlled food already passes through Ndustrial-monitored sites — and <strong>Lineage, one of Kroger\'s largest frozen 3PL partners, is a named Ndustrial reference that avoided $113M in energy spend</strong>. Kroger is already buying from a supply chain instrumented by Ndustrial; it is not instrumenting its own stores.',
  objection:[
   {o:'"We already have EMS in our stores."',r:'A building EMS controls equipment. It does not benchmark 2,700 stores against each other, correlate refrigeration performance to sales and shrink, or produce the per-appliance verification record your EPA settlement requires.'},
   {o:'"Our capex envelope just went down 4%."',r:'That is exactly the argument for this. We optimise assets you have already bought — including the new R744 fleet — with near-zero incremental capital, on a savings-share or guaranteed-savings structure.'},
   {o:'"Our refrigeration vendors handle leaks and compliance."',r:'Vendors produce service tickets. EPA expects validated appliance-level reporting. Someone has to own the evidence trail across 25 banners; that is a data function, not a service function.'},
   {o:'"We are a retailer, not an industrial operator."',r:'Lineage, Americold, USCS and Emergent Cold are all cold-chain operators and all Ndustrial customers. The physics of your low-temp distribution and store refrigeration is the same physics — you just have more of it, in more places, under more banners.'}
  ]

 snapshot:[
  `Tyson Foods is the largest US protein processor, operating roughly 300 facilities across beef, pork, chicken and prepared foods. Protein processing is among the most refrigeration-intensive manufacturing operations that exists — industrial ammonia (R717) systems supporting slaughter, chill, case-ready and frozen storage, running continuously and sized for peak throughput.`,
  `FY2025 delivered <strong>$54.4B in sales (+2.1%)</strong> but only <strong>$1,098M of operating income</strong>, weighed down by <strong>$738M of legal contingency accruals</strong>. Momentum improved sharply in FY2026: Q3 results reported 3 August 2026 showed GAAP operating income of $362M, <strong>up 39% year on year</strong>, with adjusted operating income of $547M and adjusted EPS of $0.99.`,
  `The dominant strategic event is the <strong>beef network restructuring</strong>. Facing a historic shortage in the US cattle supply, Tyson announced on 21 November 2025 the permanent closure of its Lexington, Nebraska beef plant, and on 13 August 2026 announced the closure of its Joslin, Illinois beef facility (approximately 2,500 roles) and its Eagle Mountain, Utah case-ready facility.`,
  `Tyson is therefore not in a growth-capex posture. It is in a <em>network-optimisation</em> posture, deciding with unusual frequency which plants receive investment, which absorb redistributed volume, and which are wound down. That is a decision made on unit economics — and energy cost per pound of output is a unit-economics input Tyson does not currently hold at plant-and-line granularity.`
 ],
 signals:[
  {type:'restructuring',ic:'flag',cls:'t-red',date:'2026-08-13',title:'Beef network restructuring — Joslin IL and Eagle Mountain UT closing',
   detail:'Tyson announced it will end operations at its Joslin, Illinois beef facility and its Eagle Mountain, Utah case-ready facility as part of a network restructuring to strengthen the long-term beef business. The Joslin closure affects more than 2,500 employees.',
   impact:'Critical',why:'Three beef assets closed or closing in nine months. Volume does not disappear — it is redistributed to surviving plants, changing their refrigeration load profiles, demand peaks and possibly their utility tariff demand tier. Simultaneously, closed plants carry months of idle-but-live baseload (holding temperatures, HVAC, refrigeration, water treatment) during decommissioning.',
   src:['tysonfoods.com news release · 2026-08-13','cap.unl.edu — Lexington NE economic impact analysis']},
  {type:'restructuring',ic:'flag',cls:'t-amber',date:'2025-11-21',title:'Lexington, Nebraska beef plant permanently closed',
   detail:'Tyson announced on 21 November 2025 that it would permanently close its Lexington, Nebraska beef processing facility.',
   impact:'High',why:'Establishes the pattern: this is a sustained network-consolidation programme, not a one-off. It also confirms Tyson will make further site decisions — each of which is an energy-model question.',
   src:['cap.unl.edu · 2025-11','tysonfoods.com']},
  {type:'margin',ic:'trend',cls:'t-green',date:'2026-08-03',title:'Q3 FY2026: operating income up 39% — cost-out momentum',
   detail:'Third quarter 2026 results: GAAP operating income of $362M, up 39% from prior year; adjusted operating income of $547M; adjusted EPS of $0.99.',
   impact:'High',why:'A recovering margin story means the cost-out programme has executive air cover right now. Energy is a controllable conversion cost with a faster payback than most operational levers available to a plant.',
   src:['tysonfoods.com news release · 2026-08-03']},
  {type:'capex',ic:'trend',cls:'t-cyan',date:'2025-11-10',title:'FY2026 capex guided to $700M–$1.0B',
   detail:'Tyson guided fiscal 2026 capital expenditure to between $700M and $1.0B, with sales expected up 2–4% versus fiscal 2025.',
   impact:'Medium',why:'Capital is constrained relative to the ~$1.4B historical run-rate. Only projects with short, verifiable payback will clear. Nsight optimises installed assets — it does not require a new refrigeration plant.',
   src:['tysonfoods.com Q4 FY2025 results · 2025-11-10','SEC exhibit 99.1']},
  {type:'leadership',ic:'users',cls:'t-amber',date:'2026-06-15',title:'Third COO in nine months — Wes Morris',
   detail:'Tyson named Wes Morris Chief Operating Officer effective 15 June 2026, following the appointment of Devin Cole as COO in September 2025. Phillip Thomas was named Chief Accounting Officer in April 2026. Curt Calaway succeeded John R. Tyson as CFO.',
   impact:'High',why:'Unusually dense operations-leadership churn. New COOs commission operational reviews and are receptive to new instrumentation. It also means institutional knowledge of energy performance across the network is thin.',
   src:['tysonfoods.com · 2026-06-08','feedstuffs.com','thv11.com']},
  {type:'driver',ic:'alert',cls:'t-gray',date:'2026',title:'Historic US cattle supply shortage is the forcing function',
   detail:'The closures are attributed to a severe, historic shortage in the US cattle supply rather than to Tyson-specific demand weakness.',
   impact:'Context',why:'Supply-constrained throughput means plants run below design capacity. Under-loaded refrigeration systems operate at their worst part-load efficiency — energy cost per pound rises exactly when margins are already squeezed.',
   src:['tysonfoods.com news release · 2026-08-13']},
  {type:'sustainability',ic:'globe',cls:'t-green',date:'2025',title:'Ceres Food Emissions 50 flags target ambition and disclosure',
   detail:'The Ceres Food Emissions 50 benchmark identifies gaps in Tyson\'s emissions-reduction target ambition and Scope 3 disclosure. Tyson reports eight plants validated as Zero Waste to Landfill.',
   impact:'Low-Medium',why:'Not the primary wedge — Tyson responds to unit economics before sustainability. But verified energy-per-pound data simultaneously serves the disclosure gap, making the business case dual-purpose at no extra cost.',
   src:['ceres.org — Food Emissions 50: Tyson Foods','tysonfoods.com/sustainability']},
  {type:'power',ic:'bolt',cls:'t-red',date:'2026',title:'Plants span four RTOs with radically different capacity economics',
   detail:'Springdale AR sits in SPP; Joslin IL in PJM (ComEd); Lexington NE in SWPP; Eagle Mountain UT in WECC. PJM capacity cleared at $329.17/MW-day for 2026/27 versus $28.92/MW-day in 2024/25, while SPP frequently prints negative real-time prices from wind generation.',
   impact:'High',why:'A single national energy strategy is impossible when the same kilowatt-hour carries opposite economics in different zones. SPP negative-price windows are a thermal-storage and pre-cooling opportunity that requires continuous, automated response.',
   src:['ieefa.org — PJM capacity prices','EIA / RTO pricing data']},
 ],
 pains:[
  {p:0,sev:5,title:'You are choosing which plants to invest in without energy cost per pound',
   ev:'Tyson is actively reallocating beef and case-ready volume across a shrinking footprint. Plant-level energy is reported as an aggregate utilities line, not as a cost per pound of output by line and shift. Ammonia refrigeration, chilling and freezing dominate process energy in protein conversion, and performance varies widely between plants of similar design.',
   angle:'This is Ndustrial\'s literal core proposition: "we turn energy into a measurable input, uncovering the true cost of every line, product, and process." For a company making network-consolidation decisions in real time, energy-per-pound is a first-order input to those decisions — not a reporting afterthought.'},
  {p:0,sev:5,title:'Part-load refrigeration is the least efficient operating point',
   ev:'A historic cattle shortage means plants are running below design throughput. Compressors, evaporators and defrost cycles tuned for full load operate at their worst part-load efficiency, so energy cost per pound rises precisely when the P&L can least absorb it.',
   angle:'Continuous optimisation against actual production volume, not against a fixed commissioning baseline. This is the difference between "the plant used 4% less energy" and "the plant used 9% less energy per pound".'},
  {p:1,sev:4,title:'Closed plants still burn baseload for months',
   ev:'Lexington NE, Joslin IL and Eagle Mountain UT enter decommissioning on different timelines. Until fully released, each carries refrigeration holding load, HVAC, lighting, water treatment and compressed-air baseload while producing nothing. Ammonia systems in particular cannot simply be switched off — they require managed pump-down, oil management and retained charge for restart or asset relocation.',
   angle:'Idle-site energy teardown sequencing: an explicit, measured plan for what to keep live, what to isolate, and when — with the refrigeration asset recovery value quantified alongside the avoided baseload.'},
  {p:1,sev:5,title:'Redistributed volume silently re-rates surviving plants',
   ev:'Volume from three closing sites lands on remaining beef and case-ready plants. Those plants\' refrigeration systems now run longer and harder, raising 15-minute coincident peaks. Because most industrial tariffs bill demand on a monthly or annual peak basis, a surviving plant can jump a demand tier without any capital change — a permanent cost increase triggered by someone else\'s closure decision.',
   angle:'Model the receiving-plant demand impact before the volume moves, then manage the peak during the transition. This is a genuinely non-obvious consequence of restructuring that a production-aware platform surfaces and a facilities EMS does not.'},
  {p:2,sev:4,title:'SPP negative-price hours are being wasted',
   detail:'',
   ev:'Tyson\'s Springdale HQ and much of its Southern footprint sits in SPP, which regularly clears negative real-time prices during high-wind, low-load overnight periods. Industrial refrigeration with significant thermal mass can pre-cool into those windows and coast through peak hours.',
   angle:'Grid volatility response applied to protein processing: automated pre-cooling and thermal-storage scheduling driven by real-time price signals rather than a static production schedule. Payback is measured in months because the energy is close to free.'},
  {p:3,sev:2,title:'Reefer fleet and DC electrification',
   ev:'Tyson operates a large refrigerated trailer fleet and is progressively electrifying yard and last-mile assets at distribution centres.',
   angle:'Relevant but secondary. Lead with pillars 1 and 2 — the network-consolidation and part-load arguments. Introduce shore power only once an operational foothold exists.',lowfit:true},
 ],

 comp:{
  incumbent:'Plant-level SCADA and BAS with utility submetering in larger facilities, plus corporate-level utility bill aggregation and periodic third-party energy audits. Ammonia refrigeration maintained by specialist contractors.',
  alternates:['Enel X / CPower — demand response, no process-energy view','Schneider EcoStruxure Plant — automation-centric, not energy-per-output','Ameresco / ENGIE — capital project developers, not software','Internal energy audits — episodic, not continuous'],
  wedge:'Almost no competitor frames energy as <em>cost per unit of output</em>. Ndustrial has done this since 2011 across $100M+ in verified savings, processes 250M data points daily, and has the domain credibility of monitoring sites through which 35% of US temperature-controlled food passes. Tyson\'s own protein plants are upstream and downstream of Ndustrial-monitored cold-chain assets — the operational reality is familiar territory.',
  objection:[
   {o:'"We are closing plants, not investing in software."',r:'That is precisely why. You are reallocating volume across a shrinking footprint. Knowing the true energy cost per pound of each surviving plant is an input to those decisions, and idle-plant baseload teardown is immediate cash.'},
   {o:'"Our capex envelope is $700M–$1.0B."',r:'Nsight optimises the refrigeration and process assets you already own. It is an operating expense with a savings-share or guaranteed-savings structure, not a capital project competing with automation.'},
   {o:'"Energy is a small share of our conversion cost."',r:'In protein processing, refrigeration and chilling are typically the largest process energy loads after the boiler house. At a $54.4B revenue base with 0.9% adjusted operating margin, a 1% energy reduction on process refrigeration is material to operating income.'},
   {o:'"We have sustainability targets already."',r:'Then the data will serve double duty. Verified energy-per-pound closes the disclosure gap Ceres has flagged while paying for itself through conversion cost.'}
  ]
 },

 snapshot:[
  `NewCold is a Netherlands-founded operator of highly automated, high-bay cold storage facilities — 26 sites and more than two million pallet positions across Europe, North America and Australia. Its facilities are structurally different from conventional cold storage: 140–150 foot AS/RS high-bay racking with multiple single-deep cranes, minimal human presence on the floor, and refrigeration load that is both enormous and exceptionally predictable.`,
  `The company is in an aggressive multi-continent build phase. In May 2025 it announced a <strong>$275M+ investment in Hagerstown, Maryland</strong>. In April 2026 it broke ground on a <strong>€100M facility in Noblejas, Toledo, Spain</strong> with 65,000 pallet positions. In September 2025 it inaugurated Nowy Modlin, Poland, bringing Polish capacity to <strong>207,200 pallet positions</strong>. On 31 August 2026 it opened what it describes as the most advanced automated high-bay cold storage facility in Romania.`,
  `The critical commercial fact is <em>where</em> the North American expansion is landing. Hagerstown, Maryland and Bethlehem, Pennsylvania are both in <strong>PJM</strong> — the capacity market where clearing prices moved from <strong>$28.92/MW-day (2024/25) to $329.17/MW-day (2026/27), an 11.4x increase</strong>, driven by data-centre load growth. A facility whose operating case was modelled on 2024 power assumptions is being energised into a radically different tariff environment.`,
  `A second, less obvious dynamic is regulatory. On <strong>26 May 2026</strong> EPA finalised changes to the AIM Act technology-transitions rule that <strong>extended the deadline for installation of HFC-using cold storage warehouse systems from 1 January 2026 to 1 January 2032</strong>. This removes the near-term refrigerant-forcing function for new US builds — and thereby shifts the entire value proposition from compliance urgency to <em>operating-cost certainty and commercial advantage</em>.`

   angle:'Where load cannot be reduced by behaviour it must be reduced by control. Refrigeration setpoint strategy, defrost scheduling, compressor staging and evaporator fan control are the only available levers — and they require continuous, ambient-aware optimisation rather than static commissioning settings.'},

brief:{status:'published',v:'3',date:'2026-09-09',html:`
<h4>1 · The thirty-second version</h4>
<p>Kroger has taken on a <strong>federally mandated $100M, 600-unit refrigeration retrofit programme on a 24-month clock</strong>, inside a business running a <strong>0.7% net margin</strong>, in a power market where <strong>PJM capacity prices have risen 11.4x</strong> — and their new Chief Store Operations Officer starts on <strong>14 September 2026</strong>. Three clocks are synchronised. This is the most time-critical account in the current pipeline.</p>

<h4>2 · Why now</h4>
<ul>
<li><strong>The compliance clock.</strong> On 14 May 2026 Kroger settled a DOJ/EPA Clean Air Act action: $2.5M civil penalty plus $100M over two years to retrofit or replace 600 refrigeration units. The settlement also obliges Kroger to validate that each remediated appliance meets the leakage threshold and report it to EPA. EPA opened the inquiry in 2018 — this has been building for eight years.</li>
<li><strong>The leadership clock.</strong> Mark Ibbotson joins as EVP &amp; Chief Store Operations Officer on 14 September 2026, three days from the date of this brief. Greg Foran became CEO in February 2026 after running Walmart US and Air New Zealand. Nate Faust joined as Chief eCommerce Officer on 1 September.</li>
<li><strong>The budget clock.</strong> FY2027 capital planning typically locks between October and December. FY2026 capex already contracted 4.0% to $3.855B.</li>
</ul>

<h4>3 · The number that matters</h4>
<div class="kpi">
<div><b>$147.6B</b><span>FY2025 revenue</span></div>
<div><b>0.7%</b><span>Net margin</span></div>
<div><b>$143</b><span>Sales needed per $1 of energy saved</span></div>
<div><b>11.4x</b><span>PJM capacity price increase</span></div>
</div>
<p>At a 0.7% net margin, every dollar of avoided energy spend is worth approximately <strong>$143 of incremental sales</strong>. There is no commercial lever available to Kroger with that ratio. Energy is the second-largest controllable store operating cost after labour, and refrigeration is 40–50% of store electricity. Open the Business Case Model tab for the live calculation.</p>

<h4>4 · Where we win — pain map</h4>
<table>
<thead><tr><th>Severity</th><th>Pain</th><th>Pillar</th></tr></thead>
<tbody>
<tr><td><span class="tag t-red">5/5</span></td><td>600 mandated retrofits with no verification infrastructure — EPA expects validated appliance-level reporting</td><td>Real-time optimisation</td></tr>
<tr><td><span class="tag t-red">5/5</span></td><td>Store demand charges are now effectively a PJM capacity tax on a flat, non-sheddable load profile</td><td>Real-time optimisation</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>New R744 transcritical CO2 fleet drifts with ambient conditions — commissioning settings are not annual settings</td><td>Real-time optimisation</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>Retrofit work inside operating stores creates temperature-excursion and shrink exposure</td><td>Cold product storage</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>Leak-rate reporting is a data problem, not a detection problem — threshold moved 35% → 20%</td><td>Cold product storage</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>2,700 stores represent an unmonetised demand-response and flexibility asset</td><td>Grid volatility</td></tr>
<tr><td><span class="tag t-gray">3/5</span></td><td>CFC electrification under the new eCommerce push — weakest pillar fit, do not lead with it</td><td>Shore power</td></tr>
</tbody></table>

<h4>5 · Decision unit</h4>
<table>
<thead><tr><th>Name</th><th>Role in deal</th><th>Conf.</th><th>Angle</th></tr></thead>
<tbody>
<tr><td><strong>Mark Ibbotson</strong><br><span class="dim xs">EVP &amp; Chief Store Operations Officer</span></td><td>Economic buyer — store estate</td><td><span class="tag t-green">High</span></td><td>Inherits the $100M programme on day one. Ask what his control tower looks like on 15 September.</td></tr>
<tr><td><strong>Greg Foran</strong><br><span class="dim xs">Chairman &amp; CEO</span></td><td>Economic buyer — ultimate</td><td><span class="tag t-green">High</span></td><td>Efficiency operator. Frame as margin recovery, not sustainability.</td></tr>

<h4>Executive One-Pager · Mark Ibbotson</h4>
<p class="sm dim">EVP &amp; Chief Store Operations Officer, The Kroger Co. · Starts 14 September 2026 · Economic buyer, store estate · Confidence: High</p>
<div class="hr"></div>
<h4>What he is walking into</h4>
<ul>
<li>A <strong>$100M, 600-unit refrigeration retrofit obligation</strong> on a 24-month federal clock, spread across ~2,700 stores and ~25 banners.</li>
<li>An <strong>EPA reporting requirement</strong> to validate that each remediated appliance meets the leakage threshold — an evidence obligation, not just a construction obligation.</li>
<li>A <strong>4.0% capex contraction</strong> to $3.855B, in a business running a 0.7% net margin.</li>
<li>A store estate whose <strong>capacity charges just repriced 11.4x</strong> in PJM, with no operational flexibility to shed load.</li>
<li>A new CEO (Greg Foran, February 2026) who made his reputation on operational cost discipline at Walmart US.</li>
</ul>
<h4>The question to put in front of him</h4>
<div class="q">"On 15 September, when you ask your team how many of the 600 units are done, how many are validated, and how much the programme has cost against plan — what system answers that question?"</div>
<p>If the answer is "a spreadsheet compiled from service vendors," the programme is not controllable at 600 units across 25 banners. That is the gap Nsight fills.</p>
<h4>What he cares about — and what he does not</h4>
<table>
<thead><tr><th>Lead with</th><th>Avoid</th></tr></thead>
<tbody>
<tr><td>Control and visibility across banners</td><td>Sustainability narrative — Foran's agenda is margin, not ESG</td></tr>
<tr><td>Auditability of the EPA obligation</td><td>Platform features and architecture tours</td></tr>
<tr><td>Shrink protection during retrofit waves</td><td>Anything requiring new capital in FY2026</td></tr>
<tr><td>A 90-day pilot with defined success criteria</td><td>Enterprise-wide roll-out proposals</td></tr>
<tr><td>Lineage proof point (his own supply chain)</td><td>Cold-storage case studies he cannot relate to</td></tr>
</tbody></table>
<h4>His likely first three objections</h4>
<ol>
<li><strong>"We have EMS in our stores."</strong> → A building EMS controls equipment. It does not benchmark 2,700 stores against each other, correlate refrigeration performance to sales and shrink, or produce the per-appliance verification record the settlement requires.</li>
<li><strong>"Our refrigeration vendors handle compliance."</strong> → Vendors produce service tickets. EPA expects validated appliance-level reporting. Someone has to own the evidence trail across 25 banners — that is a data function, not a service function.</li>
<li><strong>"We do not have budget this fiscal year."</strong> → Then structure it as savings-share or guaranteed savings against a verified baseline. It is an operating expense with a payback measured in months, competing for nothing in the FY2026 capex envelope.</li>
</ol>
<h4>Relationship path</h4>
<p><strong>Primary:</strong> Eric Taylor, Director of Facility Engineering (20+ years at Kroger, 2,700+ locations) — technical champion who can carry the programme into store operations.<br>
<strong>Warm introduction:</strong> Lineage — Eric Ristow, VP Product Management. Lineage is a named Ndustrial reference and a Kroger frozen 3PL partner.<br>
<strong>Validation path:</strong> David J. C. Kennerley, EVP &amp; CFO — engage only after the operational case is agreed; he will test the payback model.</p>
<h4>Recommended first move</h4>
<div class="q">Send the executive letter (direct mail, not email) to arrive in his first week. Do not lead with a meeting request. Lead with the PJM capacity-tag analysis for the Ohio/Kentucky/Indiana cluster — a specific, quantified, unsolicited finding about his own stores. Ask for 20 minutes in week three, not week one.</div>`},

<h4>Outbound Sequence · Mark Ibbotson</h4>
<p class="sm dim">5 touches over 24 days · Anchored to his 14 September start date · Sender: D. Okafor, National Accounts</p>

<h4>Touch 1 — Email · Day 0 (15 Sept, his second day)</h4>
<div class="email">
<div class="meta">TO: Mark Ibbotson &lt;m.ibbotson@thekrogerco.com&gt; · SUBJECT LINE A/B: "600 units, 24 months" / "what your control tower looks like on day two"</div>
<div class="subj">600 units, 24 months</div>
<p>Mark — congratulations on the role. I will be direct about why I am writing in your first week rather than your first quarter.</p>
<p>You have inherited a $100M, 600-unit refrigeration retrofit programme on a federal clock, across roughly 25 banners, in a power market where PJM capacity prices have risen 11.4x since 2024.</p>
<p>The part that keeps facility engineering leaders awake is not the retrofit work. It is month twenty-three, when EPA wants validated appliance-level reporting and the evidence is scattered across a few hundred service vendors' PDFs.</p>
<p>Ndustrial monitors sites through which 35% of US temperature-controlled food already passes. Lineage — one of your frozen 3PL partners — avoided $113M in energy spend on our platform, and their VP of Product Management calls us one of their closest technology partners.</p>
<p>I am not asking for a platform tour. I would like twenty minutes to show you the verification architecture specifically: how you produce an EPA-defensible evidence trail at 600 units without building a reporting department. Week three suits your calendar better than week one — I will follow up then.</p>
<p>— D. Okafor</p>
</div>

<h4>Touch 2 — Email · Day 4</h4>
<div class="email">
<div class="meta">SUBJECT: "the demand-tier surprise in your PJM stores" · Attachment: 1-page analysis (no gated form)</div>
<div class="subj">The demand-tier surprise in your PJM stores</div>
<p>Mark — a short, specific finding rather than a follow-up.</p>
<p>PJM capacity cleared at $329.17/MW-day for 2026/27 against $28.92/MW-day in 2024/25. Grocery load is flat and refrigeration-dominated, so the fifteen-minute coincident peak that sets a store's annual capacity tag is largely set by summer refrigeration and HVAC compression — the two loads hardest to shed.</p>
<p>The consequence is counter-intuitive: a store that peaks once, briefly, in July carries that capacity tag for twelve months. Peak-shaving a handful of hours per year is worth far more than reducing average consumption.</p>
<p>I have attached a one-page worked example using published tariff structures for the AEP-Ohio zone. It is not a proposal and there is nothing to sign. If the arithmetic is interesting to your team, Eric Taylor in Facility Engineering is the right person to pressure-test it.</p>
<p>— D. Okafor</p>
</div>

<h4>Touch 3 — LinkedIn · Day 8</h4>
<div class="email">
<div class="meta">CONNECTION REQUEST (300 char) + FOLLOW-UP MESSAGE</div>
<p><strong>Request note:</strong> Mark — congratulations on the Chief Store Operations role. I wrote to you about the verification architecture for the 600-unit retrofit programme. Connecting here in case email is easier to miss in a first month.</p>
<p><strong>Follow-up (once connected):</strong> One thing I did not put in the email: the R744 commitment. Transcritical CO2 crosses the critical point in summer operation, so gas-cooler pressure and parallel-compression staging that were optimal at commissioning in Ohio in March are wrong in Georgia in July. Your new-store fleet is growing into exactly that problem. Happy to share what we see across the CO2 fleets we monitor — no agenda.</p>
</div>

<h4>Touch 4 — Email · Day 12</h4>
<div class="email">
<div class="meta">SUBJECT: "Lineage, $113M, and your own supply chain"</div>
<div class="subj">Lineage, $113M, and your own supply chain</div>
<p>Mark — the strongest evidence I can offer is not a case study from another industry. It is from inside your own frozen supply chain.</p>
<p>Lineage avoided $113M in energy spend on the Nsight platform. Eric Ristow, their VP of Product Management, describes Ndustrial as "one of our closest technology partners and integral to our technology vision including our data, engineering and energy management strategies."</p>
<p>Three facts that matter for Kroger specifically:</p>
<ul>
<li>We process 250M data points per day and have held 99.99% uptime for over ten years — this is not a pilot-stage platform.</li>
<li>35% of US temperature-controlled food passes through sites we monitor; 10% globally.</li>
<li>Our recommendations are AI-powered but verified by cold-chain engineers before they reach an operator. For a federally-reportable programme, that human verification layer is not a nicety — it is the thing that makes the output defensible.</li>
</ul>
<p>Would a Lineage-referenced introduction be useful? I can arrange it.</p>
<p>— D. Okafor</p>
</div>

<h4>Touch 5 — Direct mail + email · Day 18</h4>
<div class="email">
<div class="meta">PHYSICAL: Executive letter, printed, courier to Kroger HQ Cincinnati, attention of Chief of Staff · EMAIL SUBJECT: "a letter, because email is noisy in month one"</div>
<div class="subj">See Executive Letter deliverable</div>
<p class="sm dim">The printed letter is the highest-conversion touch in this sequence for a new-tenure executive. It is couriered rather than posted, addressed to the Chief of Staff, and references a single specific number ($100M / 600 units / 24 months) so it is unmistakably not a mass mailing. Full copy in the Executive Letter deliverable.</p>
</div>

<h4>Touch 6 — Email · Day 24 (break-up)</h4>
<div class="email">
<div class="meta">SUBJECT: "closing the loop"</div>
<div class="subj">Closing the loop</div>
<p>Mark — I will stop here rather than become noise in your first quarter.</p>
<p>Two things stay on the table whenever the timing is right: the verification architecture for the 600-unit programme, and the PJM capacity-tag analysis for your Ohio/Kentucky/Indiana cluster.</p>
<p>If neither is relevant to you, the right person is almost certainly Eric Taylor in Facility Engineering — and I would rather be introduced by you than arrive cold. If that is a better use of your thirty seconds, I will take it.</p>
<p>Either way: good luck with the first hundred days.</p>
<p>— D. Okafor</p>
</div>

<h4>Sequencing notes</h4>
<ul>
<li><strong>Do not send Touch 1 before 15 September.</strong> Pre-start outreach to an incoming executive is discarded. His first full working day is the window.</li>
<li><strong>Touch 2 is the highest-value touch.</strong> An unsolicited, specific, quantified finding about his own stores, with no ask. If only one touch is sent, send this one.</li>
<li><strong>Suppress all touches</strong> if Kroger announces a refrigeration-partnership RFP or if Eric Taylor engages first — re-route to a technical track.</li>
<li><strong>Re-verify before sending:</strong> Ibbotson's confirmed start date and the current Director of Facility Engineering. Both are marked High and Medium confidence respectively in the decision unit.</li>
</ul>`},

<h4>Discovery Call Guide · Kroger</h4>
<p class="sm dim">For a first substantive conversation with Facility Engineering or Store Operations. Target duration 30 minutes.</p>

<h4>Objective</h4>
<p>Not to sell. To establish two facts: (1) whether Kroger has a system of record for the 600-unit programme's verification obligation, and (2) who owns coincident-peak demand management across the store estate. If either answer is "no" or "nobody," the call has succeeded.</p>

<h4>Pre-call checklist</h4>
<ul>
<li>Confirm the attendee's banner scope — enterprise or divisional. The conversation is materially different.</li>
<li>Have the PJM/AEP-Ohio capacity-tag one-pager ready to send within five minutes of the call ending.</li>
<li>Know the Lineage numbers cold: $113M avoided spend, Eric Ristow VP Product Management quote, 99.99% uptime over ten years.</li>
<li>Do <strong>not</strong> claim knowledge of which 600 units are in scope — that detail is not public.</li>
<li>Check for a Kroger refrigeration-partnership RFP in the last 60 days before calling.</li>
</ul>

<h4>Opening — thirty seconds, no deck</h4>
<div class="q">"Thanks for the time. I am not going to walk you through a platform. I want to ask you three questions about the 600-unit programme and the PJM capacity position, and if what I hear tells me we are not useful, I will say so and stop taking your time. Fair?"</div>

<h4>Question bank</h4>
<p class="lbl">Situation — establish the operating reality</p>
<ol>
<li>Walk me through how a retrofit completion is currently recorded and validated. Who signs it, and what evidence is attached?</li>
<li>How is refrigeration performance compared across banners today? Is there a common metric, or does each division report differently?</li>
<li>Who owns coincident-peak demand management at store level — facilities, energy procurement, or nobody explicitly?</li>
<li>How far along is the R744 transcritical deployment, and who owns performance optimisation after commissioning?</li>
<li>What does your utility-bill data pipeline look like today? How many suppliers, how many tariff structures, what latency?</li>
</ol>
<p class="lbl">Problem — find the cost of the gap</p>
<ol>
<li>When a store's demand charge jumps month on month, how long does it take to find out why, and who does that work?</li>
<li>Has a temperature excursion during retrofit or maintenance work ever produced a shrink event you could not attribute confidently?</li>
<li>When EPA asks you to validate that a remediated appliance meets the 20% leakage threshold, what does the artefact look like today?</li>
<li>How often do refrigeration service visits turn out to be unnecessary — a truck roll that a remote diagnostic would have avoided?</li>
<li>What is your current confidence that you could produce an appliance-level compliance report on demand, this afternoon?</li>
</ol>
<p class="lbl">Implication — make the gap expensive</p>
<ol>
<li>If the 600-unit programme finishes on time but the validation evidence is not auditable, what does month twenty-five look like?</li>
<li>At a 0.7% net margin, what does a 3% store energy reduction actually mean to operating profit — and does anyone currently hold that number?</li>
<li>If PJM capacity stays at 2026/27 levels through the FY2027 plan, what does that do to the store P&amp;L you are being asked to hold?</li>
<li>How much of your facility engineering team's time is spent assembling energy data rather than acting on it?</li>
</ol>
<p class="lbl">Need-payoff — let them articulate the value</p>
<ol>
<li>If every retrofit completion came with a verified before-and-after performance record automatically, what would that change for you?</li>
<li>If you could benchmark refrigeration efficiency across all 2,700 stores on one screen, what would you do with the outliers?</li>
<li>Suppose peak-shaving were automated against real-time price and capacity signals rather than managed manually. What would that be worth against the FY2027 plan?</li>
</ol>

<h4>Numbers to have ready</h4>
<table>
<thead><tr><th>If they ask</th><th>Say</th></tr></thead>
<tbody>
<tr><td>Typical savings</td><td>"Documented range of 8–15% on refrigeration energy. We model conservatively at 6% in business cases and let the actual data argue upward."</td></tr>
<tr><td>Time to value</td><td>"Live in weeks, not quarters — that is the published commitment. A single-division pilot can be producing verified data inside a quarter."</td></tr>
<tr><td>Scale proof</td><td>"250M data points a day, 99.99% uptime over ten years, $100M+ in savings unlocked since 2011."</td></tr>
<tr><td>Commercial model</td><td>"Guaranteed savings or savings-share against a verified baseline. We are not asking for capital from a capex envelope that just contracted 4%."</td></tr>
<tr><td>Disruption</td><td>"No production disruption is a stated commitment. We read existing controls and meters; we do not replace your BAS."</td></tr>
</tbody></table>

<h4>Landmines</h4>
<ul>
<li><strong>Do not lead with sustainability.</strong> Greg Foran came from Walmart US operations. The agenda is margin and control. Sustainability is a secondary benefit to be mentioned only if they raise it.</li>
<li><strong>Do not disparage their BAS vendors.</strong> Johnson Controls and Honeywell are installed-base incumbents. Position Nsight as the layer above them, not a replacement.</li>
<li><strong>Do not reference the settlement as a failure.</strong> It was a settlement, not a finding of wrongdoing beyond the CFC leak-rate reporting. Frame it as an operational scale challenge.</li>
<li><strong>Do not promise a specific unit count or savings figure for Kroger</strong> before baseline data exists. The credibility cost of an unverified number is higher than the benefit.</li>
</ul>

<h4>Next-step asks, in order of preference</h4>
<ol>
<li><strong>Best:</strong> A 60-minute technical working session with Facility Engineering on the verification architecture for the 600-unit programme.</li>
<li><strong>Good:</strong> Permission to run the PJM capacity-tag analysis on a named store cluster and present findings.</li>
<li><strong>Acceptable:</strong> Introduction to Eric Taylor or the Energy/Utilities function.</li>
<li><strong>Floor:</strong> A Lineage-referenced introduction to Ibbotson's office.</li>
</ol>`};

<h4>Battlecard · Kroger</h4>
<p class="sm dim">Positioning against the alternatives Kroger will actually consider</p>

<h4>Positioning statement</h4>
<div class="q">For a grocery operator running thousands of refrigerated sites under a federal verification obligation, Nsight is the only platform that unifies energy, production, controls and external market data into a single auditable view — verified by cold-chain engineers rather than handed over as raw AI output.</div>

<h4>Against the status quo</h4>
<p><strong>What they have:</strong> Store-level BAS from Johnson Controls / Honeywell, refrigeration service vendors, episodic utility-bill analysis, manual spreadsheets.</p>
<p><strong>Why it fails:</strong> It is site-scoped, not portfolio-scoped. It controls equipment but does not benchmark, correlate to sales or shrink, or produce an appliance-level evidence trail. It cannot answer "how many of the 600 are done and validated" at any point in time.</p>
<p><strong>Kill question:</strong> "If EPA asked for an appliance-level compliance report this afternoon, how long would it take you and how many people would it involve?"</p>

<h4>Against Enel X / CPower (demand response aggregators)</h4>
<p><strong>Where they are strong:</strong> DR enrolment, curtailment payments, market access. Kroger may already have a relationship.</p>
<p><strong>Where they are weak:</strong> No refrigeration domain depth, no production awareness, no verification layer, no cold product-integrity monitoring. They monetise flexibility once a year; they do not reduce the underlying energy or improve compliance.</p>
<p><strong>Kill question:</strong> "Does your DR provider tell you why a store's demand spiked, or only that it did?"</p>
<p><strong>Reframe:</strong> Do not compete — stack. Grid volatility response includes DR, so an existing aggregator is complementary, not disqualifying.</p>

<h4>Against Schneider EcoStruxure / Siemens Building X</h4>
<p><strong>Where they are strong:</strong> Building-scale digital twins, credible enterprise procurement, existing relationships from store construction.</p>
<p><strong>Where they are weak:</strong> Building-centric, not cold-chain-centric. No refrigeration process expertise, no integration of energy-market and carbon datasets, no cold-product-integrity monitoring, and no cold-chain engineer verification layer. They optimise a building; Kroger's problem is a refrigerated product chain.</p>
<p><strong>Kill question:</strong> "Can they tell you energy cost per case shipped, or only kWh per square foot?"</p>

<h4>Against Retroficiency / Autodesk (M&amp;V)</h4>
<p><strong>Where they are strong:</strong> Measurement and verification methodology, IPMVP-aligned, credible with sustainability teams.</p>
<p><strong>Where they are weak:</strong> Modelling and periodic M&amp;V, not continuous live optimisation. They verify after the fact; they do not reduce the bill in real time or respond to grid signals.</p>
<p><strong>Kill question:</strong> "Is it a continuous control layer or an annual report?"</p>

<h4>Against insourcing</h4>
<p><strong>What they will say:</strong> "We have data science and facilities engineering; we could build this."</p>
<p><strong>Response:</strong> Kroger could. It would take a multi-year engineering programme, require cold-chain refrigeration domain expertise that grocery retail does not retain internally, and compete for the same scarce engineering resource as the eCommerce and CFC automation build-out under the new Chief eCommerce Officer. Ndustrial has done this since 2011 across 35% of US temperature-controlled food volume.</p>
<p><strong>Kill question:</strong> "How many cold-chain refrigeration engineers does Kroger employ whose full-time job is refrigeration thermodynamics rather than store maintenance?"</p>

<h4>Proof points to deploy</h4>
<table>
<thead><tr><th>Claim</th><th>Evidence</th></tr></thead>
<tbody>
<tr><td>Scale</td><td>250M data points processed per day on Nsight</td></tr>
<tr><td>Reliability</td><td>99.99% uptime for over ten years</td></tr>
<tr><td>Results</td><td>$100M+ in energy savings unlocked since 2011</td></tr>
<tr><td>Sector depth</td><td>35% of US temperature-controlled food passes through Ndustrial sites; 10% globally</td></tr>
<tr><td>Named reference</td><td>Lineage avoided $113M in energy spend; Eric Ristow, VP Product Management, calls Ndustrial "one of our closest technology partners"</td></tr>
<tr><td>Second reference</td><td>Blackline Partners — "came to our aid like a cavalry" — demand charge reduction</td></tr>
<tr><td>Human verification</td><td>AI-powered recommendations backed by cold-chain experts who validate before operator delivery</td></tr>
</tbody></table>

<h4>Traps they will set for us</h4>
<ul>
<li><strong>"Guarantee us a number."</strong> Do not. Guarantee against a verified baseline after a measurement period, or offer savings-share. An unbaselined guarantee is unenforceable and destroys credibility.</li>
<li><strong>"Show me your grocery references."</strong> Be honest: the deepest references are cold storage and food production. Lineage is the bridge — it is Kroger's own 3PL partner. Do not overclaim grocery-specific deployments.</li>
<li><strong>"Integrate with our existing BAS."</strong> Commit to read-only integration and no production disruption. Do not propose replacing store controls.</li>
<li><strong>"What is your security posture?"</strong> Have the enterprise security documentation ready before the call. A $147.6B retailer will run a full vendor security review; being unprepared here ends the process regardless of technical merit.</li>
</ul>`};

<h4>Campaign Brief — "The Verification Gap"</h4>
<p class="sm dim">Marketing · Owner: Madeline Belvin · Proposed window: Oct–Dec 2026 · Budget band: $85–120K</p>

<h4>The insight that makes this campaign</h4>
<div class="q">The AIM Act and its enforcement aftermath have created a category of compliance obligation that operators can <em>physically</em> meet but <em>evidentially</em> fail. Kroger is retrofitting 600 units. Tyson is consolidating a beef network across four RTOs. NewCold has just been given six more years of refrigerant runway. In every case the hard part is no longer the engineering — it is producing defensible, continuous, appliance-level proof.</div>
<p>This is not a sustainability campaign and not an efficiency campaign. It is a <strong>provability</strong> campaign. It lands because it names a problem every VP of Facility Engineering already feels and no vendor is articulating.</p>

<h4>Why now</h4>
<ul>
<li>EPA's 26 May 2026 final rule reshuffled every operator's compliance calendar in the same month. The confusion is fresh and unresolved.</li>
<li>PJM capacity repricing (11.4x) hit utility bills across the 2026/27 delivery year — operators are seeing the cost before they understand the cause.</li>
<li>FY2027 budget planning runs October to December across the target list.</li>
<li>The Kroger settlement is public, recent and un-contested — a legitimate news hook that is not about naming and shaming a prospect.</li>
</ul>

<h4>Audience segments</h4>
<table>
