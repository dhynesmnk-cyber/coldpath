DELIV.kroger.letter={status:'published',v:'1',date:'2026-09-10',html:`
<h4>Executive Letter — Direct Mail</h4>
<p class="sm dim">Printed, couriered to Kroger HQ Cincinnati, attention of the Chief of Staff · Arrives week of 15 September 2026</p>
<div class="hr"></div>
<p class="mono xs dim">— LETTERHEAD: NDUSTRIAL — COLD CHAIN ENERGY INTELLIGENCE —</p>
<p>15 September 2026</p>
<p>Mr. Mark Ibbotson<br>Executive Vice President &amp; Chief Store Operations Officer<br>The Kroger Co.<br>1014 Vine Street, Cincinnati, OH 45202</p>
<p><strong>Dear Mr. Ibbotson,</strong></p>
<p>Congratulations on your appointment. I am writing in your first week rather than your first quarter for one reason: a clock you inherited started before you arrived, and it does not pause for onboarding.</p>
<p>In May, Kroger agreed with the Department of Justice and the Environmental Protection Agency to spend $100 million over two years retrofitting or replacing 600 refrigeration units, and to validate that each remediated appliance meets the applicable leakage threshold. The engineering is well understood. Kroger has done harder things at greater scale.</p>
<p>The part that is not well understood — and that I would put in front of you before it becomes a problem in month twenty-three — is the evidence. Six hundred units, across roughly twenty-five banners, executed by hundreds of third-party service contractors, each producing their own documentation format, all of it needing to resolve into a single validated report to a federal regulator. That is not a construction problem. It is a data problem, and it is almost always discovered late.</p>
<p>I am not writing to propose a platform. I am writing to offer one specific thing: the verification architecture we would build for a programme of exactly this shape, as a document, with no commercial ask attached. If it is useful, use it whether or not you ever speak to us again. If it is not, you have lost four minutes.</p>
<p>For context on why I think we are qualified to draw it: Ndustrial monitors sites through which 35% of all temperature-controlled food in the United States already passes. Lineage — a frozen partner in your own supply chain — has avoided $113 million in energy spend on our platform, and their VP of Product Management describes us as one of their closest technology partners. We process 250 million data points a day and have held 99.99% uptime for more than ten years. Our recommendations are generated by machine and verified by cold-chain engineers before they ever reach an operator, which is the reason our customers are willing to put their name to them in a regulatory context.</p>
<p>There is a second matter, less urgent but larger in dollar terms. PJM capacity cleared at $329.17 per megawatt-day for 2026/27, against $28.92 two years earlier — an increase of more than eleven times, driven almost entirely by data-centre demand rather than anything Kroger did. Your stores have flat, refrigeration-dominated load profiles, which means they absorb that increase without the operational flexibility that caused it. Enclosed is a one-page worked example for the AEP-Ohio zone using published tariff structures. It contains no Kroger-confidential data and requires nothing from you.</p>
<p>If either item earns twenty minutes in your third or fourth week, my colleague Daniel Okafor will come with the verification architecture and nothing else. If neither is relevant, the right person is almost certainly your Director of Facility Engineering, and an introduction would be worth more to us than the meeting.</p>
<p>Good luck with the first hundred days. On the evidence of what you have inherited, you will need it — and you have our respect for taking it on.</p>
<p>Yours sincerely,</p>
<p><strong>[Name]</strong><br>Vice President, Enterprise Accounts<br>Ndustrial</p>
<p class="mono xs dim">ENCLOSURES: (1) Verification architecture for a 600-unit federal retrofit programme, 6pp. (2) PJM capacity-tag worked example, AEP-Ohio zone, 1pp.</p>
<div class="hr"></div>
<h4>Production notes</h4>
<ul>
<li><strong>Format:</strong> Real letterhead, single-sided on 120gsm, hand-signed in ink. Courier, not post. Addressed to the Chief of Staff with "For the attention of Mr. Ibbotson — time sensitive" on the outer.</li>
<li><strong>Length is deliberate.</strong> Two pages. A one-page letter reads as marketing; two pages of specific, sourced content reads as a professional communication.</li>
<li><strong>Every number is publicly sourced.</strong> Nothing in this letter references Kroger-confidential information. That is what makes it safe to send unsolicited.</li>
<li><strong>The two enclosures must actually exist</strong> and be genuinely useful with no strings attached. If they are gated or thin, the letter backfires.</li>
<li><strong>Do not send</strong> if Ibbotson's start date slips or if a Ndustrial contact is already active in the account — coordinate with D. Okafor first.</li>
</ul>`};

DELIV.kroger.social={status:'published',v:'1',date:'2026-09-10',html:`
<h4>Social / LinkedIn — Kroger-seeded</h4>
<p class="sm dim">Three posts. None mention Kroger by name in a negative frame. All are seeded from public, sourced findings.</p>

<h4>Post 1 — The Verification Gap (thought leadership)</h4>
<div class="email">
<div class="meta">AUTHOR: Ndustrial CEO or VP Engineering · FORMAT: text + single image · BEST TIME: Tue 08:00 ET</div>
<p>The hardest part of the HFC transition was never the engineering.</p>
<p>In May, EPA moved the cold storage warehouse technology-transition deadline from January 2026 to January 2032. Six years of runway, handed back in a single rulemaking.</p>
<p>Meanwhile a major US grocery operator agreed to spend $100M retrofitting 600 refrigeration units in 24 months — and to validate each one to a federal regulator afterwards.</p>
<p>Put those two facts together and a pattern emerges: the industry has largely solved "how do we replace the equipment." It has not solved "how do we prove what our equipment is doing."</p>
<p>Across 25 banners and hundreds of service contractors, an appliance-level evidence trail is not a paperwork exercise. It is a data architecture question, and it is almost always discovered in month 23 of a 24-month programme.</p>
<p>If you are running a retrofit wave right now, ask yourself one question: could you produce a validated, appliance-level compliance report this afternoon?</p>
<p>If the answer involves a spreadsheet and a phone tree, that is the project.</p>
<p>#coldchain #refrigeration #AIMAct #energymanagement #compliance</p>
</div>

<h4>Post 2 — The capacity price shock (data-led)</h4>
<div class="email">
<div class="meta">AUTHOR: Madeline Belvin, Demand Gen · FORMAT: text + chart image (PJM capacity 2024/25 vs 2026/27) · BEST TIME: Thu 07:30 ET</div>
<p>$28.92 per megawatt-day. That was the PJM capacity clearing price for 2024/25.</p>
<p>$329.17 per megawatt-day. That is 2026/27.</p>
<p>An eleven-fold increase, driven almost entirely by data-centre load growth — not by anything a grocery store, a cold storage warehouse or a food plant did.</p>
<p>Here is what makes it worse for cold chain specifically: our load profiles are flat. A supermarket, a -20°C high-bay warehouse, a protein conversion plant — these do not have flexible demand. There is no shift to reschedule, no production line to pause. The load is what it is, and it peaks in summer when everyone else's does too.</p>
<p>So we absorb a cost increase caused by someone else's growth, with fewer tools to manage it than almost any other industrial sector.</p>
<p>But "flat load" is not the same as "inflexible load." Refrigeration has enormous thermal mass. Pre-cool, then coast. Shift compressor staging. Manage the fifteen-minute coincident peak that sets your capacity tag for a full twelve months.</p>
<p>The facilities doing this well are not spending capital. They are instrumenting what they already own.</p>
<p>#PJM #energy #coldchain #demandresponse #utilities</p>
</div>

<h4>Post 3 — Energy per pound (manufacturing-led)</h4>
<div class="email">
<div class="meta">AUTHOR: Ndustrial Engineering lead · FORMAT: text only, no image · BEST TIME: Wed 12:00 ET</div>
<p>A protein processor closed three beef plants in nine months.</p>
<p>The coverage focused on jobs, cattle supply and consolidation. Nobody covered the energy consequence, which is the part that quietly changes the economics of the surviving plants.</p>
<p>Volume does not disappear when a plant closes. It moves. And when it lands on the receiving sites, those sites' refrigeration systems run longer and harder, their fifteen-minute coincident peaks rise, and — because most industrial tariffs bill demand on a peak basis — they can jump a demand tier without a single capital change.</p>
<p>A plant that was economically fine in March becomes structurally more expensive in October because a facility four states away stopped operating.</p>
<p>Separately, the plants running below design throughput because of constrained cattle supply are operating their ammonia systems at part load — which is the least efficient point on the curve. Energy cost per pound rises exactly when margin can least absorb it.</p>
<p>Both of these are invisible in a monthly utility bill. Both are obvious the moment you measure energy against output instead of against the meter.</p>
<p>That is the argument for production-aware energy management: not "use less," but "know what a pound actually costs to make."</p>
<p>#foodmanufacturing #ammoniarefrigeration #energyefficiency #operations</p>
</div>

<h4>Publishing notes</h4>
<ul>
<li><strong>Never name a prospect in a problem frame.</strong> Post 1 says "a major US grocery operator" — the fact is public via the DOJ release, but attributing a compliance failure to a named account in a live sales motion is unacceptable.</li>
<li><strong>Post 2 carries the strongest commercial intent</strong> and is the one to boost with paid spend against the retail and 3PL segments.</li>
<li><strong>Post 3 is the Tyson-seeded asset</strong> — publish it only after the Tyson outbound sequence has made first contact, so the rep can reference it as context rather than having it appear as an ambush.</li>
<li><strong>Engagement routing:</strong> any comment or reaction from a target-list company should trigger an engine notification to the account owner within one hour.</li>
</ul>`};

brief:{status:'in-review',v:'2',date:'2026-09-08',html:`
<h4>1 · The thirty-second version</h4>
<p>Tyson has closed or announced the closure of three beef assets in nine months while simultaneously posting a <strong>39% year-on-year increase in Q3 FY2026 operating income</strong>. It is running a cost-out programme with executive air cover, under a constrained capex envelope, and it is making network-allocation decisions right now <em>without energy cost per pound of output as an input</em>. That missing input is our product.</p>

<h4>2 · Why now</h4>
<ul>
<li><strong>13 August 2026:</strong> beef network restructuring announced — Joslin, Illinois (approx. 2,500 roles) and Eagle Mountain, Utah case-ready both closing.</li>
<li><strong>21 November 2025:</strong> Lexington, Nebraska beef plant permanently closed. This is a sustained programme, not a one-off.</li>
<li><strong>15 June 2026:</strong> Wes Morris starts as COO — the third chief operating officer in nine months, following Devin Cole in September 2025. New COOs commission operational reviews.</li>
<li><strong>3 August 2026:</strong> Q3 FY2026 GAAP operating income $362M, up 39%; adjusted operating income $547M. Cost-out is working and has momentum.</li>
<li><strong>FY2026 capex guided to $700M–$1.0B</strong>, well below the ~$1.4B historical run-rate. Only fast-payback operating-expense plays will clear.</li>
</ul>

<h4>3 · The core insight — and it is not about saving energy</h4>
<div class="q">Volume from three closing plants does not disappear. It is redistributed to surviving facilities. Those facilities' ammonia refrigeration systems run longer and harder, their fifteen-minute coincident peaks rise, and because most industrial tariffs bill demand on a peak basis, a receiving plant can jump a demand tier permanently — without a single capital change and without any decision being made about it.</div>
<p>A plant that was economically fine in March becomes structurally more expensive in October because a facility four states away stopped operating. This is invisible in a monthly utility bill. It is obvious the moment energy is measured against output.</p>
<p>Second-order effect: a historic cattle shortage means surviving plants run <strong>below design throughput</strong>. Ammonia systems, compressors and evaporators tuned for full load operate at their worst part-load efficiency. Energy cost per pound rises precisely when margin is under pressure.</p>

<h4>4 · Where we win — pain map</h4>
<table>
<thead><tr><th>Severity</th><th>Pain</th><th>Pillar</th></tr></thead>
<tbody>
<tr><td><span class="tag t-red">5/5</span></td><td>Network allocation decisions are being made without plant-and-line-level energy cost per pound</td><td>Real-time optimisation</td></tr>
<tr><td><span class="tag t-red">5/5</span></td><td>Redistributed volume silently re-rates receiving plants into higher demand tiers</td><td>Cold product storage</td></tr>
<tr><td><span class="tag t-red">5/5</span></td><td>Part-load operation under cattle shortage is the least efficient point on the refrigeration curve</td><td>Real-time optimisation</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>Closed plants carry idle-but-live baseload for months — holding temps, HVAC, ammonia management</td><td>Cold product storage</td></tr>
<tr><td><span class="tag t-amber">4/5</span></td><td>Four RTOs with opposite economics: PJM at $329/MW-day capacity while SPP prints negative real-time prices</td><td>Grid volatility</td></tr>
<tr><td><span class="tag t-gray">2/5</span></td><td>Reefer fleet and DC electrification — real but secondary, do not lead with it</td><td>Shore power</td></tr>
</tbody></table>

<h4>5 · Decision unit</h4>
<table>
<thead><tr><th>Name</th><th>Role</th><th>Conf.</th><th>Angle</th></tr></thead>
<tbody>
<tr><td><strong>Wes Morris</strong><br><span class="dim xs">Chief Operating Officer</span></td><td>Economic buyer — operations</td><td><span class="tag t-green">High</span></td><td>In role since 15 June 2026. Owns restructuring execution. Needs the true delivered cost of each surviving plant. <strong>Primary entry point.</strong></td></tr>
<tr><td><strong>Donnie King</strong><br><span class="dim xs">President &amp; CEO</span></td><td>Economic buyer — ultimate</td><td><span class="tag t-green">High</span></td><td>Career Tyson operator. Responds to throughput, yield and conversion cost — not sustainability.</td></tr>
<tr><td><strong>Curt Calaway</strong><br><span class="dim xs">Chief Financial Officer</span></td><td>Financial validator</td><td><span class="tag t-green">High</span></td><td>Owns a constrained capex envelope against $738M of legal accruals. Needs sub-18-month payback.</td></tr>
<tr><td><strong>John R. Tyson</strong><br><span class="dim xs">Director; Chair, Strategy &amp; Acquisitions</span></td><td>Influencer — strategic</td><td><span class="tag t-green">High</span></td><td>Fourth-generation. Formerly CFO <em>and</em> Chief Sustainability Officer — unusually understands both cases.</td></tr>
<tr><td><span class="dim">VP Engineering / Plant Utilities</span></td><td>Technical champion</td><td><span class="tag t-red">Gap</span></td><td>Tyson does not publish plant engineering leadership. Resolve via Apollo/Clay or the Lineage relationship chain.</td></tr>
</tbody></table>

<h4>6 · Recommended plays</h4>
<ol>
<li><strong>Receiving-plant demand re-rating analysis.</strong> Identify which surviving beef and case-ready plants absorb Joslin/Eagle Mountain/Lexington volume, and model the coincident-peak and demand-tier consequence. Time-critical, quantifiable, gives value before any commercial ask.</li>
<li><strong>Energy cost per pound, benchmarked across comparable plants.</strong> The core proposition. Start with 3–5 beef plants of similar design to prove variance before proposing network scale.</li>
<li><strong>Idle-plant baseload teardown sequencing</strong> for Lexington, Joslin and Eagle Mountain. Immediate cash, low political resistance, natural pilot-sized entry.</li>
<li><strong>SPP negative-price pre-cooling</strong> at Springdale and Southern footprint plants. Payback measured in months because the energy is close to free.</li>
</ol>

<h4>7 · Risk register</h4>
<ul>
<li><strong>Sustainability is the wrong door.</strong> Tyson responds to unit economics. Ceres Food Emissions 50 has flagged target ambition, but leading with ESG will route this to a communications function with no budget.</li>
<li><strong>Political sensitivity.</strong> Three plant closures and ~2,500+ roles lost is a live labour and community story. Any external communication referencing the closures must be reviewed carefully. The internal business case is unaffected; the marketing campaign is not.</li>
<li><strong>Procurement scale.</strong> A $54.4B company with ~300 facilities will not move fast. Assume a single-segment or single-plant pilot.</li>
<li><strong>Unresolved technical champion.</strong> Without a named plant engineering contact, a COO-level conversation stalls at pilot design. This is the highest-priority gap to close.</li>
</ul>
<h4>8 · Provenance</h4>
<p class="sm dim">Compiled from 10 sources on 8 September 2026. Primary: Tyson Foods news releases (Aug 2026, Jun 2026, Nov 2025); FY2025 Form 10-K; UNL Center for Agricultural Profitability Lexington closure analysis; Ceres Food Emissions 50; IEEFA PJM capacity analysis.</p>`},

<p class="sm dim">Chief Operating Officer, Tyson Foods · In role since 15 June 2026 · Economic buyer, operations · Confidence: High</p>

outbound:{status:'in-review',v:'1',date:'2026-09-08',html:`
<h4>Outbound Sequence · Wes Morris, COO</h4>
<p class="sm dim">4 touches over 21 days · Secondary track to Tyson plant engineering leadership once identified · Sender: M. Delgado, Protein</p>

<h4>Touch 1 — Email · Day 0</h4>
<div class="email">
<div class="meta">SUBJECT: "where the Joslin volume lands — and what it costs"</div>
<div class="subj">Where the Joslin volume lands — and what it costs</div>
<p>Mr. Morris — I will be brief and specific.</p>
<p>When beef volume from Joslin and Eagle Mountain is redistributed to receiving plants, those plants' ammonia systems run longer and harder. Their fifteen-minute coincident peaks rise. Because most industrial tariffs bill demand on a peak basis rather than on consumption, a receiving plant can move up a demand tier permanently — with no capital change and no decision ever taken about it.</p>
<p>The same applies in reverse to the closing sites: an ammonia plant under managed decommissioning carries holding temperatures, HVAC, water treatment and retained charge for months while producing nothing.</p>
<p>Ndustrial measures energy against output rather than against the meter — cost per pound, per line, per shift. We have done it since 2011 across sites through which 35% of US temperature-controlled food passes.</p>
<p>I would like to send you a short, specific analysis of the receiving-plant demand re-rating for the Joslin and Eagle Mountain redistribution. It uses published tariff structures, contains no Tyson-confidential data, and carries no ask. If it is useful, keep it. Twenty minutes in your fourth week would let me pressure-test it against your actual plant list.</p>

<div class="meta">SUBJECT: "part-load is the expensive end of the curve"</div>
<div class="subj">Part-load is the expensive end of the curve</div>
<p>Mr. Morris — one follow-up on the cattle supply constraint, because it has an energy consequence that does not appear anywhere in a monthly utility bill.</p>
<p>Plants running below design throughput are operating their refrigeration systems at part load, which is the least efficient point on the compressor curve. Compressors stage poorly, evaporator approach widens, defrost cycles run against a reduced load. Total energy consumption falls. <em>Energy cost per pound rises.</em></p>
<p>So the plants under the most margin pressure from constrained supply are simultaneously the plants whose unit energy economics are degrading fastest — and the monthly bill looks like good news.</p>
<p>This is the entire argument for measuring energy against output rather than against the meter. Happy to show what it looks like across three comparable beef plants before anyone commits to anything.</p>
<p>— M. Delgado</p>

function roiCalc(k){
 const m=ROI[k],o={};m.inputs.forEach(i=>o[i.k]=i.v);
 const total=o.sites*o.elec, ref=total*o.refShare/100;
 const refSave=ref*o.refSave/100, demSave=total*o.demandSave/100, other=o.sites*o.shrink;
 const gross=refSave+demSave+other;
 o._total=total;o._ref=ref;o._refSave=refSave;o._demSave=demSave;o._other=other;o._gross=gross;
 o._sales=gross/(o.netMargin/100);o._perSite=gross/o.sites;
 return o;
}

   <p class="mt"><strong>Data handling.</strong> No prospect-confidential data is ever ingested. Everything in the prototype above is from public sources — which is precisely what makes unsolicited outreach legally and ethically safe.</p>
  </div></div>
  <div class="card"><div class="card-h">${ic('alert')}<span class="h3">Honest limitations</span></div><div class="card-b sm muted">
   <ul style="margin-left:16px">
    <li><strong>Private companies are harder.</strong> NewCold's CFO and engineering leadership could not be resolved from public sources. Expect a higher gap rate on private accounts — which is exactly why paid enrichment earns its place in phase 2.</li>
    <li><strong>Contact data needs a paid source.</strong> Public research identifies roles reliably and named individuals inconsistently. Apollo or Clay closes this at real cost.</li>
    <li><strong>Savings estimates are models, not measurements.</strong> The business case uses published benchmarks and conservative assumptions. A verified baseline requires deployment.</li>
    <li><strong>Judgement is still the bottleneck at the gate.</strong> The engine cuts research from hours to minutes; it does not remove the marketing review. Budget 20–30 minutes per account, not zero.</li>
    <li><strong>It will get things wrong.</strong> Eric Taylor's Kroger title is Medium confidence and inferred from a professional profile. The confidence model exists to make those errors visible before they reach a prospect.</li>
   </ul></div></div>

/* ---------- utilities ---------- */
const JUNK=new Set(['na','n a','n/a','unknown','none','-','','test','tbd','xxx']);
function normName(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9& ]/g,' ')
    .replace(/\b(inc|llc|ltd|lp|llp|corp|corporation|company|co|plc|gmbh|sa|nv|bv|the|and)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}
function tokens(s){return new Set(normName(s).split(' ').filter(t=>t.length>1))}
function jaccard(a,b){const A=tokens(a),B=tokens(b);if(!A.size||!B.size)return 0;
  let i=0;A.forEach(x=>{if(B.has(x))i++});return i/(A.size+B.size-i)}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){
    cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}prev=cur}
  return prev[n]}
function typoSim(a,b){a=normName(a);b=normName(b);if(!a||!b)return 0;
  return 1-lev(a,b)/Math.max(a.length,b.length)}
/* G4 — entity resolution against the 114-account RMP registry.
   MEASURED FAILURE this design exists to prevent: a naive string-similarity
   resolver matched "VersaCold Logistics" to the registry alias
   "Americold Logistics" at 0.79 (edit distance between "versacold" and
   "americold" is only 4). Because Americold is an existing customer, a real
   prospect was silently suppressed as a customer and vanished from the list.
   Raw edit distance is therefore never sufficient on its own: a match requires
   at least one shared DISTINCTIVE token, and distinctive tokens are compared
   against a generic-industry stoplist and a weak-discriminator list. */
const GENERIC=new Set(['logistics','logistic','cold','storage','stores','foods','food','group','holdings','holding',
 'companies','company','services','service','industries','industry','international','global','national','systems',
 'system','distribution','warehousing','warehouse','frozen','refrigerated','partners','partner','enterprise',
 'enterprises','wholesale','grocers','grocery','dairy','farms','farm','meats','meat','poultry','beef','pork',
 'seafood','terminal','transport','trucking','lines','line','provisions','provision','brands','brand','usa',
 'american','the','and','of','solutions','management','operating','operatingpartnership']);
const WEAK=new Set(['united','states','national','general','standard','premium','quality','first','great',
 'pacific','atlantic','central','western','eastern','northern','southern','america','north','south']);
function distinctive(s){return [...tokens(s)].filter(t=>!GENERIC.has(t)&&t.length>2)}
function strong(s){return distinctive(s).filter(t=>t.length>=5&&!WEAK.has(t))}
function tokSim(a,b){if(a===b)return 1;const m=Math.max(a.length,b.length);return m?1-lev(a,b)/m:0}
function distMatch(a,b){
  const A=distinctive(a),B=distinctive(b),As=strong(a),Bs=strong(b);
  if(!A.length||!B.length)return{ratio:0,strongShared:0,shared:0};
  let shared=0,typoShared=0;
  A.forEach(x=>{
    if(B.includes(x))shared++;
    else if(x.length>=5&&B.some(y=>y.length>=5&&tokSim(x,y)>=.84))typoShared++;
  });
  const strongShared=As.filter(x=>Bs.includes(x)||Bs.some(y=>tokSim(x,y)>=.84)).length;
  return{ratio:(shared+typoShared*.85)/Math.min(A.length,B.length),strongShared,shared:shared+typoShared};
}
const REG_IX=(()=>{const m=[];REG.forEach((r,i)=>{m.push({i,k:normName(r[0])});
  (r[1]||[]).forEach(al=>{const k=normName(al);if(k&&!JUNK.has(k))m.push({i,k})})});return m})();
const MATCH_MIN=.5;
function resolveEntity(name){
  const raw=(name||'').trim();
  const nk=normName(raw);
  if(!raw||JUNK.has(nk))return{hit:null,score:0,reason:'junk_or_empty',method:'none'};
  const exact=REG_IX.find(x=>x.k===nk);
  if(exact)return{hit:REG[exact.i],score:1,reason:'exact',method:'canonical/alias exact match'};
  let best={i:-1,score:0,dm:null,k:''};
  REG_IX.forEach(x=>{
    const dm=distMatch(raw,x.k);
    const sc=dm.strongShared>0?Math.min(.99,.62+dm.ratio*.37):(dm.shared>0?dm.ratio*.5:Math.max(jaccard(raw,x.k),typoSim(raw,x.k))*.4);
    if(sc>best.score)best={i:x.i,score:sc,dm,k:x.k};
  });
  const okStr=best.dm&&best.dm.strongShared>0&&best.dm.ratio>=MATCH_MIN&&best.score>=.62;
  if(okStr)return{hit:REG[best.i],score:+best.score.toFixed(2),reason:'fuzzy',
    method:`distinctive-token match (${best.dm.strongShared} strong, ratio ${best.dm.ratio.toFixed(2)})`};
  const runner=REG_IX.filter(x=>x.i!==best.i).map(x=>{const dm=distMatch(raw,x.k);
    return dm.strongShared>0?Math.min(.99,.62+dm.ratio*.37):(dm.shared>0?dm.ratio*.5:Math.max(jaccard(raw,x.k),typoSim(raw,x.k))*.4)}).sort((a,b)=>b-a)[0]||0;
  const nearMiss=best.dm&&(best.dm.shared>0||best.score>=.45);
  if(nearMiss&&best.score-runner<.12)return{hit:null,score:+best.score.toFixed(2),reason:'ambiguous',
    method:'two candidates within 0.12',candidate:REG[best.i]?REG[best.i][0]:null};
  if(nearMiss&&best.score>=.45)return{hit:null,score:+best.score.toFixed(2),reason:'ambiguous',
    method:`partial distinctive overlap (ratio ${(best.dm?best.dm.ratio:0).toFixed(2)}) — below the match threshold`,
    candidate:REG[best.i]?REG[best.i][0]:null};
  return{hit:null,score:+best.score.toFixed(2),reason:'no_match',method:'no distinctive token overlap'};
}

function detectDelim(text){
  const line=text.split(/\r?\n/).find(l=>l.trim())||'';
  return [',',';','\t','|'].map(d=>({d,n:line.split(d).length-1})).sort((a,b)=>b.n-a.n)[0].d||',';
}
function csvParse(text,delim){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else{if(c==='"')q=true;
      else if(c===delim){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(c!=='\r')cur+=c}}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function detectHeader(rows){
  for(let i=0;i<Math.min(rows.length,8);i++){
    const r=rows[i],filled=r.filter(c=>c&&c.trim());
    if(filled.length>=2&&filled.every(c=>!/^[\d.,$\s]+$/.test(c))&&filled.some(c=>/[A-Za-z]{3}/.test(c))&&r.length>=3)
      return i;
  }
  return 0;
}

const FIELD_ALIASES={
 account_name:['account name','name','company','company name','account','client','customer','customer name','account title'],
 website:['website','web','url','domain','web address'],
 industry:['industry','vertical','sector','market'],
 revenue:['annual revenue','revenue','arr','annual sales','turnover'],
 owner:['owner','account owner','rep','sales rep','assigned to','account executive','ae'],
 type:['type','account type','status','stage'],
 last_activity:['last activity','last touched','last modified','last contact'],

};
function autoMap(headers){
  const map={},used=new Set();
  Object.entries(FIELD_ALIASES).forEach(([field,al])=>{
    const h=headers.map(x=>x.trim().toLowerCase());
    let idx=al.map(a=>h.indexOf(a)).find(i=>i>=0&&!used.has(i));
    if(idx===undefined)idx=al.map(a=>h.findIndex(x=>x.includes(a))).find(i=>i>=0&&!used.has(i));
    if(idx!==undefined){map[field]=idx;used.add(idx)}
  });
  return map;
}

function crmRun(text,name){
  const delim=detectDelim(text);
  const raw=csvParse(text,delim);
  const hrow=detectHeader(raw);
  const headers=(raw[hrow]||[]).map(x=>(x||'').trim());
  const ncols=headers.length;
  const map=autoMap(headers);
  const get=(r,f)=>map[f]!==undefined?(r[map[f]]||'').trim():'';
  const recs=[],malformed=[];
  raw.slice(hrow+1).forEach((r,i)=>{
    const rownum=hrow+i+2;
    if(!r.some(c=>(c||'').trim())){malformed.push({rownum,why:'empty row'});return}
    if(r.length!==ncols)malformed.push({rownum,why:`${r.length} cells, expected ${ncols}`});
    const nm=get(r,'account_name');
    if(!nm){malformed.push({rownum,why:'no account name (C4 required field)'});return}
    const res=resolveEntity(nm);
    // C5: suppress only on an exact alias hit or a distinctive-token match.
    // A fuzzy hit alone is never enough to delete a prospect from the list.
    const cust=isCustomer(nm)||!!(res.hit&&res.hit[7]&&(res.reason==='exact'||res.reason==='fuzzy'));
    const la=get(r,'last_activity'),d=daysSince(la);
    recs.push({rownum,name:nm,website:get(r,'website'),industry:get(r,'industry'),
      revenue:get(r,'revenue'),owner:get(r,'owner'),type:get(r,'type'),state:get(r,'state'),
      lastAct:la,days:d,res, cust});
  });
  const ok=recs.filter(r=>!r.cust);
  const matched=ok.filter(r=>r.res.hit);
  const crmOnly=ok.filter(r=>!r.res.hit);
  const ambiguous=recs.filter(r=>r.res.reason==='ambiguous');
  const suppressed=recs.filter(r=>r.cust);
  const unassigned=ok.filter(r=>!r.owner);
  const stale=ok.filter(r=>r.days!==null&&r.days>365);
  const nodate=ok.filter(r=>!r.lastAct||r.days===null);
  const seen=new Set(matched.map(r=>r.res.hit[0]));
  const whitespace=REG.filter(r=>!r[7]&&!seen.has(r[0])).sort((a,b)=>b[2]-a[2]);
  const missingMap=Object.keys(FIELD_ALIASES).filter(f=>map[f]===undefined);
  const unmapped=headers.map((h,i)=>({h,i})).filter(x=>!Object.values(map).includes(x.i));
  const g=[];
  g.push({id:'C1',s:'pass',n:'Delimiter & encoding',d:`Detected <span class="mono">${delim==='\t'?'TAB':delim}</span> separator across ${raw.length} rows. UTF-8 decoded without replacement characters.`});
  g.push({id:'C2',s:hrow===0?'pass':'warn',n:'Header row detection',d:hrow===0?'Header on row 1 as expected.':`Header detected on row ${hrow+1}; ${hrow} leading row(s) skipped.`});
  g.push({id:'C3',s:missingMap.length<=2?'pass':'warn',n:'Field mapping',d:`${Object.keys(map).length} of ${Object.keys(FIELD_ALIASES).length} engine fields auto-mapped.${missingMap.length?` Unmapped: <span class="mono">${missingMap.join(', ')}</span> — optional, ingestion proceeds.`:''}`});
  g.push({id:'C4',s:malformed.length?'warn':'pass',n:'Required fields',d:malformed.length?`${malformed.length} row(s) rejected — each listed below with its row number. Valid rows still ingest.`:'Every row carries an account name.'});
  g.push({id:'G4',s:ambiguous.length?'warn':'pass',n:'Entity resolution',d:`${matched.length} of ${ok.length} prospect rows resolved to a canonical registry account. ${ambiguous.length?`<b>${ambiguous.length} ambiguous</b> — two candidates within 0.12, routed to human resolution rather than guessed.`:'No ambiguous matches.'}`});
  g.push({id:'C5',s:suppressed.length?'pass':'warn',n:'Customer suppression',d:suppressed.length?`${suppressed.length} existing customer(s) suppressed <b>after</b> resolution, matching on every known alias: ${suppressed.map(r=>`<span class="mono">${esc(r.name)}</span>`).join(', ')}.`:'No customers detected. Verify the customer list was loaded — suppression against an empty list is the failure mode this gate exists to prevent.'});
  g.push({id:'C6',s:unassigned.length?'warn':'pass',n:'Ownership',d:unassigned.length?`${unassigned.length} account(s) have no owner and are routed to the unassigned queue: ${unassigned.map(r=>esc(r.name)).join(', ')}.`:'Every account has an owner.'});
  g.push({id:'C7',s:'pass',n:'Cross-source reconciliation',d:`<b>${matched.length}</b> matched to the registry · <b>${crmOnly.length}</b> CRM-only · <b>${whitespace.length}</b> registry accounts absent from your CRM (whitespace).`});
  g.push({id:'C8',s:stale.length?'warn':'pass',n:'Activity currency',d:stale.length?`${stale.length} account(s) untouched for 12+ months: ${stale.map(r=>`${esc(r.name)} (${r.days}d)`).join(', ')}. Flagged, not deleted.${nodate.length?` ${nodate.length} row(s) carry no activity date.`:''}`:'All accounts show recent activity.'});
  g.push({id:'C9',s:'pass',n:'Read-only guarantee',d:'No write credentials exist. Nothing has been or can be sent back to your CRM.'});
  g.push({id:'G0',s:'pass',n:'Provenance',d:`Source <span class="mono">${esc(name)}</span> · ingested ${TODAY.toISOString().slice(0,10)} · ${recs.length+malformed.length} rows · licence: your own CRM data.`});
  ING.crm={name,text,delim,hrow,headers,ncols,map,recs,malformed,g,ok,matched,crmOnly,ambiguous,suppressed,unassigned,stale,whitespace,unmapped,missingMap};
}

  // title / company
  const atLine=lines.find(l=>/\s+at\s+[A-Z]/.test(l)&&l.length<120);
  const dotLine=lines.find(l=>/^[^·]{3,70}\s·\s[A-Z][^·]{2,60}$/.test(l)&&!/connections/i.test(l));
  if(atLine){const[,ti,co]=atLine.match(/^(.*?)\s+at\s+(.*)$/);add('title',ti,'clean','observed');add('company',co,'clean','observed')}
  else if(dotLine){const[ti,co]=dotLine.split('·').map(x=>x.trim());add('title',ti,'clean','observed');add('company',co,'clean','observed')}
  else{const cand=lines.find(l=>/(VP|Vice President|Director|Manager|Chief|Officer|Head of|Engineer|President|COO|CFO|CEO)/i.test(l)&&l.length<110);
    if(cand){add('title',cand,'inferred','observed')}}

  const loc=lines.find(l=>/(Greater .* Area|^[A-Z][\w\s]+,\s*[A-Z]{2}$|^[A-Z][\w\s]+,\s*[A-Z][\w\s]+(,\s*[A-Z]{2})?$)/.test(l)&&l.length<70&&!/connections/i.test(l));

function reviewQueue(){

  ING.crm.crmOnly.forEach(r=>q.push({g:'C7',p:'crm',t:`${r.name} has no registry match`,d:'Not an error — no RMP filing found. Either below the 10,000 lb ammonia threshold, non-US, or not refrigeration-intensive. Confirms which accounts can be enriched deeply and which cannot.',s:'t-gray'}));
  ING.crm.unassigned.forEach(r=>q.push({g:'C6',p:'crm',t:`${r.name} has no owner`,d:'Routed to the unassigned queue. A brief nobody owns is a brief nobody reads.',s:'t-amber'}));
  ING.crm.malformed.forEach(m=>q.push({g:'G3',p:'crm',t:`Row ${m.rownum} rejected`,d:m.why+' Valid rows still ingested.',s:'t-red'}));
  ING.crm.stale.forEach(r=>q.push({g:'C8',p:'crm',t:`${r.name} untouched ${r.days} days`,d:'Flagged, not deleted. Stale CRM records are still real accounts.',s:'t-gray'}));
 }
 ING.bd.forEach(d=>{
  if(d.cls==='unclassifiable')q.push({g:'R2',p:'bd',t:`${d.n} could not be classified`,d:'Neither research nor activity markers are meaningful. Human sorting required — the engine does not guess.',s:'t-amber'});
  if(d.cls==='rejected')q.push({g:'R1',p:'bd',t:`${d.n} refused`,d:'No text layer extractable in-browser; routed to the extraction queue with its reason. Not discarded.',s:'t-red'});
  if(d.cls==='prior_research'&&d.stale)q.push({g:'R4',p:'bd',t:`${d.n} is ${d.meta.days} days old`,d:`Historical context only, capped at confidence 2. Every claim from it renders as "as of ${d.meta.date}".`,s:'t-amber'});
  if(d.failed&&d.failed.length)q.push({g:'R9',p:'bd',t:`${d.n} — ${d.failed.length} failed outcome(s) indexed`,d:`${d.failed.join('; ')}. Matching recommendations will be suppressed or annotated.`,s:'t-gray'});
 });
 ING.li.forEach(r=>{
  const u=r.fields.find(f=>f.k==='source_url');
  if(!u||u.how==='missing')q.push({g:'L4',p:'li',t:`${(r.fields.find(f=>f.k==='name')||{v:'Unnamed capture'}).v} — no source URL`,d:'Accepted but capped at confidence 1. The observation may still be valuable; it is just visibly weaker.',s:'t-amber'});

 });

 if(ING.sispec){
  if(ING.sispec.missing.length)ING.sispec.missing.forEach(m=>q.push({g:m==='verification_date'?'S2':'G3',p:'sispec',t:`SalesIntel spec missing "${m}"`,d:m==='verification_date'?'Without it the 90-day verification cycle cannot be tracked and every contact must be treated as confidence 1. Request in writing before signature.':'Critical field required by the gates. Ingestion blocked until supplied.',s:'t-red'}));

 }

function siRequestText(p){

 if(!p.missing.length)t+='  (none — all critical fields present)\n';
 t+='\nFields we would like to add if available:\n';
 p.requested.forEach(r=>{const sp=SI_DICT[r];t+='  - '+r+'  — '+(sp?sp[4].replace(/\*\*/g,'').split('.')[0]:'')+'\n'});
 if(!p.requested.length)t+='  (none outstanding)\n';
 if(p.unmatched.length){t+='\nFields in your spec we do not recognise — please confirm intent:\n';p.unmatched.forEach(u=>t+='  - '+u+'\n')}

}

function costOf(op,n){return (RATES[op]?RATES[op].u:0)*n}
function costTotals(){
  const byCat={},byKind={llm:0,data:0,free:0,infra:0};let ops=0,tokens=0;
  COST.ledger.forEach(e=>{
    const c=costOf(e.op,e.n);
    byCat[e.op]=(byCat[e.op]||0)+c;
    byKind[RATES[e.op].kind]+=c; ops+=e.n;
    tokens+=(RATES[e.op].tok||0)*e.n;
  });
  const infraProrated=RATES.infra.u*(COST.daysElapsed/COST.daysInMonth);
  byCat.infra=infraProrated; byKind.infra=infraProrated;
  const mtd=Object.values(byCat).reduce((a,b)=>a+b,0);
  const variable=mtd-infraProrated;
  const projected=variable*(COST.daysInMonth/COST.daysElapsed)+RATES.infra.u;
  const p=COST.planned;
  const steady=p.accounts*RATES.research.u
    + p.accounts*p.deliverablesPerAccount*RATES.deliverable.u
    + p.accounts*p.refreshesPerAccountPerMonth*RATES.refresh.u
    + p.accounts*p.enrichmentPerAccount*RATES.enrichment.u
    + p.newsPerMonth*RATES.news.u + RATES.infra.u;
  const researched=COST.ledger.filter(e=>e.op==='research').reduce((a,e)=>a+e.n,0);
  const deliv=COST.ledger.filter(e=>e.op==='deliverable').reduce((a,e)=>a+e.n,0);

  // infrastructure. Dividing total spend by one operation type overstates it,
  // so each metric states what it includes.
  const genSpend=(byCat.deliverable||0)+(byCat.research||0)+(byCat.refresh||0)+(byCat.enrichment||0)+(byCat.news||0);
  return {byCat,byKind,mtd,variable,infraProrated,projected,steady,ops,tokens,researched,deliv,

    perAccountLoaded:researched?mtd/researched:0,

    perDeliverableAll:deliv?genSpend/deliv:0,
    freeShare:Object.keys(byCat).filter(k=>RATES[k]&&RATES[k].kind==='free').length};
}

let TI=0,TON=false;
const W=()=>(typeof innerWidth!=='undefined'&&innerWidth)||1280;
const H=()=>(typeof innerHeight!=='undefined'&&innerHeight)||800;
function tourStart(i){TI=i||0;TON=true;tourGo()}
function tourEnd(save){
 TON=false;
 const sp=document.getElementById('t-spot'),cd=document.getElementById('t-card');
 if(sp){sp.classList.remove('on');sp.style.display='none'}
 if(cd)cd.classList.remove('on');
 if(save)try{localStorage.setItem('cp_tour_seen','1')}catch(e){}
}
function tourGo(){
 if(!TON)return;
 const st=TOUR[TI];if(!st)return tourEnd(true);
 try{if(st.setup)st.setup()}catch(e){}
 if(st.v&&S.view!==st.v)S.view=st.v;
 render();
 const raf=typeof requestAnimationFrame==='function'?requestAnimationFrame:f=>setTimeout(f,16);
 raf(()=>raf(()=>tourPlace()));
}
function tourPlace(){
 if(!TON)return;
 const st=TOUR[TI],sp=document.getElementById('t-spot'),cd=document.getElementById('t-card');
 if(!sp||!cd)return;
 let el=null;
 if(st.sel){try{el=document.querySelector(st.sel)}catch(e){el=null}
   if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'center'})}catch(e){}}
 const paint=()=>{
  document.getElementById('t-step').textContent=`Step ${TI+1} of ${TOUR.length}${st.tag?' · '+st.tag:''}`;
  document.getElementById('t-title').textContent=st.t;
  document.getElementById('t-body').innerHTML=st.b;
  document.getElementById('t-dots').innerHTML=TOUR.map((_,i)=>`<i class="${i===TI?'on':i<TI?'done':''}"></i>`).join('');
  document.getElementById('t-back').style.visibility=TI?'visible':'hidden';
  document.getElementById('t-next').textContent=TI===TOUR.length-1?'Finish':'Next';
  let has=false,r=null;
  if(el&&el.getBoundingClientRect){r=el.getBoundingClientRect();
    if(r.width>6&&r.height>6&&r.bottom>0&&r.top<H())has=true}
  if(has){
   sp.style.display='block';
   sp.style.left=(r.left-7)+'px';sp.style.top=(r.top-7)+'px';
   sp.style.width=(r.width+14)+'px';sp.style.height=(r.height+14)+'px';
   sp.classList.add('on');
  } else {sp.classList.remove('on');sp.style.display='none'}
  const cw=356,ch=cd.offsetHeight||258,w=W(),h=H();
  let x,y;
  if(has){
   x=r.right+20;y=r.top+Math.max(0,(r.height-ch)/2);
   if(x+cw>w-18)x=r.left-cw-20;
   if(x<18){x=Math.max(18,(w-cw)/2);y=r.bottom+20}
   if(y+ch>h-18)y=Math.max(18,h-ch-18);
  } else {x=Math.max(18,(w-cw)/2);y=Math.max(18,(h-ch)/2)}
  cd.style.left=x+'px';cd.style.top=y+'px';cd.classList.add('on');
 };
 if(el&&el.scrollIntoView)setTimeout(paint,190);else paint();
}
(function bindTour(){
 const nx=document.getElementById('t-next'),bk=document.getElementById('t-back'),sk=document.getElementById('t-skip');
 if(nx)nx.onclick=()=>{if(TI>=TOUR.length-1)tourEnd(true);else{TI++;tourGo()}};
 if(bk)bk.onclick=()=>{if(TI>0){TI--;tourGo()}};
 if(sk)sk.onclick=()=>tourEnd(true);
 document.addEventListener('keydown',e=>{
  if(!TON)return;
  if(e.key==='Escape'){tourEnd(true);return}
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(TI>=TOUR.length-1)tourEnd(true);else{TI++;tourGo()}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(TI>0){TI--;tourGo()}}
 });
 if(typeof addEventListener==='function')addEventListener('resize',()=>{if(TON)tourPlace()});
 /* auto-start now lives in maybeTour(), called from enterApp() after sign-in */
})();
